# llm-cpr e2e 快车道（Forgejo Actions）
# 每次推 master 跑一轮：typecheck + 全量单测 + e2e 快车道（场景 1/2/5）。
# runner 跑在 job 容器里（node:22-bookworm，host 网络），无宿主 systemd，
# e2e 的生产 PID 护栏用 CPR_E2E_SKIP_PID_GUARD=1 豁免（本地跑不豁免）。
# 代码获取不用外部 actions：用 job 容器自动注入的 GITHUB_TOKEN 直接克隆本机 Forgejo。
name: e2e
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  fast-lane:
    runs-on: docker-bookworm
    env:
      CPR_E2E_SKIP_PID_GUARD: '1'
    steps:
      - name: clone（自托管：直接从本机 Forgejo 克隆，不经外部 actions）
        # 显式钉住触发分支：仓的 HEAD 曾被指到别的分支，克隆默认分支会测错代码。
        run: git clone --depth 1 --branch "${GITHUB_REF_NAME}" "http://oauth2:${GITHUB_TOKEN}@127.0.0.1:3001/${GITHUB_REPOSITORY}.git" .
      - name: 对齐提交
        run: git log --oneline -1
      - name: 安装依赖（typecheck 需要 typescript）
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: 全量单测
        run: node --test
      - name: e2e 快车道（场景 1/2/5）
        run: node scripts/e2e/run-scenarios.ts
