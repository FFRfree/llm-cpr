<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轨迹 · LLM CPR 后台</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
/* trajectory-gitgraph 票 02 改版：两列布局——左会话，右主面板（消息树 / 消息列表切换）。
   节点 = 一个消息前缀（一次「对话状态」）；同一前缀的重试收进 ×N 节点；
   分叉 = 曲线岔出到新泳道；分支栏勾选决定画哪些链（主干 = 最长链，也算一条分支）。
   正文走右侧抽屉浮层（点树节点或列表行打开），不再单占一列。 */
.traj{grid-template-columns:230px 1fr}
#pane-main{min-width:0}
#main-bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#main-bar .fam{font-size:11px;color:var(--muted);flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vswitch{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.vswitch button{background:none;border:none;color:var(--muted);padding:4px 12px;cursor:pointer;font-size:12px}
.vswitch button.on{color:var(--text);background:var(--hover)}
#traj-branchbar{border-bottom:1px solid var(--border);font-size:12px}
#traj-branchbar .bh{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
#traj-branchbar .bh b{font-size:11px;color:var(--text-2)}
#traj-branchbar .bh button{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px}
#traj-branchbar .bh button:hover{color:var(--text);border-color:var(--border-strong)}
.bitem{display:flex;gap:7px;padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.bitem:hover{background:var(--hover)}
.bitem.off{opacity:.38}
.bitem input{margin-top:3px;accent-color:var(--success);flex-shrink:0}
.bitem .tx{flex:1;min-width:0;overflow:hidden}
.bitem .tx .l1{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .tx .l2{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gwrap{overflow-x:auto;max-width:100%}
#gtraj-svg g.nodeg{cursor:pointer}
#gtraj-svg g.nodeg:hover .hitrect{fill:var(--hover)}
#gtraj-svg g.nodeg.cur circle.dot{stroke:var(--text);stroke-width:2}
.traj-note2{padding:6px 10px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border)}
/* 列表视图 */
.lrow{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px}
.lrow:hover,.lrow.cur{background:var(--hover)}
.lrow .st{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.lrow .idx{font-family:var(--mono);color:var(--muted);width:44px;flex-shrink:0}
.lrow .tm{font-family:var(--mono);width:66px;flex-shrink:0}
.lrow .tk{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 5px;font-family:var(--mono);flex-shrink:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.lrow .by{font-family:var(--mono);color:var(--muted);flex-shrink:0}
/* 抽屉：正文浮层 */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:-8px 0 24px rgba(0,0,0,.25);z-index:60;display:flex;flex-direction:column}
#drawer.hidden{display:none}
#dhead{padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#dhead .dtitle{font-size:12px;font-weight:700;margin-bottom:6px;word-break:break-all}
#dclose{float:right;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:1px 8px;cursor:pointer}
#dclose:hover{color:var(--text)}
#dbody{overflow-y:auto;flex:1;padding:0 0 40px}
#attempt-strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0}
#attempt-strip button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:11px;font-family:var(--mono)}
#attempt-strip button.on{color:var(--text);border-color:var(--border-strong);background:var(--hover)}
#attempt-strip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}
@media (max-width:760px){.traj{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h2>轨迹查看器</h2>
<p class="muted" style="font-size:12px;margin:0 0 4px">
  会话内每条请求是往同一棵「消息前缀树」上走一步：节点 = 一个消息前缀（对话状态），连线 = 追加消息，
  分叉 = 同一前缀拐出不同走向，同一前缀的重试收进 ×N 节点。左列挑会话 → 右侧切「消息树」
  （分支可勾选，主干 = 最长链，也是一条分支）或「消息列表」（按轮平铺）→ 点开看该状态任意一次尝试的完整正文。
</p>
<div class="toolbar">
  <input id="f-search" type="search" placeholder="会话 ID 过滤…" autocomplete="off">
</div>
<div id="err"></div>
<div class="traj">
  <section id="pane-sessions">
    <h3>会话（有捕获的）</h3>
    <ul id="traj-sessions"></ul>
  </section>
  <section id="pane-main">
    <div id="main-bar">
      <div class="vswitch">
        <button data-view="tree" class="on">消息树</button>
        <button data-view="list">消息列表</button>
      </div>
      <div class="fam" id="traj-family">挑一个会话</div>
    </div>
    <div id="traj-branchbar" hidden></div>
    <div id="traj-main"><div class="empty" style="padding:20px;text-align:center">选一个会话</div></div>
  </section>
</div>
</main>

<aside id="drawer" class="hidden" aria-hidden="true">
  <div id="dhead">
    <button id="dclose" type="button">✕ 关闭</button>
    <div class="dtitle" id="dtitle"></div>
    <div id="attempt-strip" hidden></div>
  </div>
  <div id="dbody"></div>
</aside>

<script src="/assets/app.js"></script>
<script>
'use strict';
const state = { sessions: [], identity: null, tenant: null, turns: [], turnId: null,
  chainByTurn: new Map(), chain: [], forest: null, branches: [], sel: {}, statusByCapture: new Map(),
  roleByHash: new Map(), previewByNode: new Map(), outOfWindow: 0, view: 'tree' };
// 泳道配色（亮暗两套主题下都可见）。
const RAILS = ['#3fae7a', '#d29a3a', '#5b8def', '#9a6fd0', '#d05b6a', '#3a9ad2', '#7aa23f', '#b06fd0'];
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString('zh-CN', { hour12: false }) : '—';
const stCol = (s) => s == null ? 'var(--muted)' : (s < 300 ? 'var(--success)' : s === 499 ? 'var(--muted)' : 'var(--danger)');

/* ---- 左列：会话清单（不变） ---- */
async function loadSessions() {
  const q = $('#f-search').value.trim().toLowerCase();
  const data = await fetchJson(withTenant('/api/audit/sessions?page=1&page_size=200&sort=last_ts&order=desc'));
  state.sessions = (data.sessions || []).filter((s) => !q || String(s.identity).toLowerCase().includes(q));
  $('#traj-sessions').innerHTML = state.sessions.map((s) => `
    <li data-identity="${esc(s.identity)}" data-tenant="${esc(s.tenant || 'default')}">
      <div class="who">${esc(s.identity)}</div>
      <div class="meta">${esc(s.tenant || 'default')} · ${s.requests} 请求 · ${rel(s.last_ts)}</div>
    </li>`).join('') || '<li class="empty">没有匹配的会话</li>';
}

/* 主面板顶部：家族徽标 + 缓存效率（family-observability 票 03，压缩进一行）。 */
async function loadFamilyHeader(turns) {
  const threadKeys = new Set();
  for (const entry of state.chainByTurn.values()) threadKeys.add(entry.thread_key);
  let line1 = `<b>${threadKeys.size > 1 ? 'deleg 家族' : '单线程'}</b> · ${threadKeys.size || '?'} 线程 · ${turns.length} 轮`;
  $('#traj-family').innerHTML = line1;
  if (!state.identity) return;
  try {
    const eff = await fetchJson(`/api/capture/cache-efficiency?identity=${encodeURIComponent(state.identity)}&tenant=${encodeURIComponent(state.tenant)}&limit=500`);
    const pct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const k = (v) => v == null ? '—' : v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    $('#traj-family').innerHTML =
      `${line1} · 效率 <b>${pct(eff.totals?.efficiency)}</b> · 浪费 ${pct(eff.totals?.waste_share)} · 重读 ×${k(eff.totals?.read_multiplier)} · ~${k(eff.totals?.corpus_tokens_est)} tok${eff.totals?.turns_skipped_no_usage ? ` · ${eff.totals.turns_skipped_no_usage} 轮无 usage` : ''}`;
  } catch { /* 效率条失败不挡轨迹 */ }
}

/* ---- 账本状态：按 capture_id 对回 status/ttft（分页拉到盖住最早轮次为止） ---- */
async function loadStatuses(tenant, identity, sinceTs) {
  state.statusByCapture = new Map();
  for (let page = 1; page <= 20; page++) {
    const data = await fetchJson(`/api/audit/requests?tenant=${encodeURIComponent(tenant)}&identity=${encodeURIComponent(identity)}&page=${page}&page_size=200`);
    const rows = data.requests || [];
    if (!rows.length) break;
    for (const r of rows) if (r.capture_id) state.statusByCapture.set(r.capture_id, r);
    if (rows.length < 200 || Math.min(...rows.map((r) => r.ts)) < sinceTs - 60_000) break;
  }
}

/* ---- 前缀森林：节点 = 一个 refs 前缀；同一前缀的轮次收进同一节点 ---- */
function buildForest(chain, threadLabels) {
  const trie = new Map(); // refs.join('\u0000') -> node
  const nodes = [];
  for (const entry of chain) {
    const refs = entry.refs || [];
    if (!refs.length) continue;
    let parent = null;
    for (let l = refs.length - 1; l >= 1; l--) {
      const p = trie.get(refs.slice(0, l).join('\u0000'));
      if (p) { parent = p; break; }
    }
    const key = refs.join('\u0000');
    let node = trie.get(key);
    if (!node) {
      node = { id: nodes.length, refs, parent, children: [], turns: [], threadKey: entry.thread_key };
      nodes.push(node); trie.set(key, node);
      if (parent) parent.children.push(node);
    }
    node.turns.push(entry);
    // 角色表：链条目已知「第 N 条起分歧，角色 X」→ 记 hash→role。
    if (entry.first_diff_in_thread_index != null && entry.first_diff_in_thread_role)
      state.roleByHash.set(refs[entry.first_diff_in_thread_index], entry.first_diff_in_thread_role);
  }
  // 子树规模 + 主干（每棵树从根起反复走「子孙最多」的孩子）
  const sizes = new Map();
  const sizeOf = (n) => {
    if (sizes.has(n.id)) return sizes.get(n.id);
    sizes.set(n.id, 1); // 防环占位（refs 前缀树天然无环，稳妥起见）
    const total = 1 + n.children.reduce((s, c) => s + sizeOf(c), 0);
    sizes.set(n.id, total);
    return total;
  };
  const roots = nodes.filter((n) => !n.parent);
  const trunks = new Map(); // treeRootId -> [nodeIds]
  for (const root of roots) {
    sizeOf(root);
    const path = [];
    let cur = root;
    while (cur) { path.push(cur.id); const kids = cur.children.slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id)); cur = kids[0] || null; }
    trunks.set(root.id, path);
  }
  // 分支 = 分叉点上非主干的每个孩子
  const branches = [];
  const walk = (n, treeRoot, depth) => {
    const kk = n.children.slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id));
    kk.forEach((c, i) => {
      if (i > 0) branches.push({ id: String(c.id), parent: n, node: c, treeRoot, forkAt: n.refs.length + 1, count: sizes.get(c.id), ts: c.turns[0].ts, depth: depth + 1 });
      walk(c, treeRoot, i > 0 ? depth + 1 : depth);
    });
  };
  for (const root of roots) {
    const label = threadLabels.get(root.threadKey) ?? root.threadKey.slice(0, 12);
    branches.push({ id: 'trunk-' + root.id, trunk: true, node: root, treeRoot: root, count: trunks.get(root.id).length, ts: root.turns[0].ts, depth: 0, label });
    walk(root, root, 0);
  }
  branches.sort((a, b) => (a.trunk ? -1 : b.trunk ? 1 : a.ts - b.ts));
  state.forest = { nodes, roots, sizes, trunks, byId: new Map(nodes.map((n) => [n.id, n])) };
  state.branches = branches;
}

/* ---- 主面板：视图切换 ---- */
function setView(view) {
  state.view = view;
  $$('#main-bar .vswitch button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  $('#traj-branchbar').hidden = view !== 'tree';
  renderMain();
}
function renderMain() {
  if (!state.forest) return;
  $('#traj-branchbar').hidden = state.view !== 'tree'; // 初次装载时摘掉模板里的 hidden 属性
  if (state.view === 'tree') { renderBranchbar(); renderTree(); }
  else renderList();
  markCur();
}
/* 列表视图：全部轮次按旧→新平铺（编号与树的 ts 序一致），点行开抽屉 */
function renderList() {
  const oldToNew = state.turns.slice().reverse();
  const byId = new Map(oldToNew.map((t, i) => [t.id, i + 1]));
  const chainIdx = new Map(state.chain.map((e, i) => [e.id, i]));
  $('#traj-main').innerHTML =
    (state.outOfWindow ? `<div class="traj-note2">${state.outOfWindow} 轮在 500 轮取证窗口外（编号按窗口内）。</div>` : '') +
    oldToNew.map((t) => {
      const e = chainIdx.has(t.id) ? state.chain[chainIdx.get(t.id)] : null;
      const st = state.statusByCapture.get(t.capture_id)?.status;
      const dups = e?.common_prefix_in_thread;
      return `<div class="lrow" data-turn="${t.id}">` +
        `<span class="st" style="background:${stCol(st)}"></span>` +
        `<span class="idx">#${byId.get(t.id)}</span>` +
        `<span class="tm">${fmtTime(t.ts)}</span>` +
        `<span class="tk">${esc(String(e?.thread_key ?? '').slice(0, 10))}</span>` +
        `<span class="tx">${dups != null ? `同前 ${dups} 条 · ` : ''}${e?.first_diff_in_thread_role ? `[${esc(e.first_diff_in_thread_role)}]` : ''}</span>` +
        `<span class="by">${Math.round(t.bytes / 1024)}KB</span>` +
        `</div>`;
    }).join('');
  $$('#traj-main .lrow').forEach((el) => el.addEventListener('click', () => openDrawerForTurn(Number(el.dataset.turn))));
}
function markCur() {
  $$('#gtraj-svg g.nodeg').forEach((g) => {
    const n = state.forest.byId.get(Number(g.dataset.node));
    g.classList.toggle('cur', !!n && n.turns.some((t) => t.id === state.turnId));
  });
  $$('#traj-main .lrow').forEach((el) => el.classList.toggle('cur', Number(el.dataset.turn) === state.turnId));
}

/* ---- 树渲染（分支栏 + git-graph） ---- */
function hiddenSet() {
  const hide = new Set();
  for (const [id, on] of Object.entries(state.sel)) {
    if (on) continue;
    const b = state.branches.find((x) => x.id === id);
    if (!b) continue;
    if (b.trunk) { for (const nid of state.forest.trunks.get(b.treeRoot.id)) hide.add(nid); continue; }
    const stack = [b.node];
    while (stack.length) { const n = stack.pop(); if (hide.has(n.id)) continue; hide.add(n.id); n.children.forEach((c) => stack.push(c)); }
  }
  return hide;
}
function railCol(l) { return RAILS[l % RAILS.length]; }
function retryColor(list) {
  const st = list.map((t) => { const r = state.statusByCapture.get(t.capture_id); return r ? r.status : null; });
  if (st.length && st.every((s) => s != null && s < 300)) return 'var(--success)';
  if (st.length && st.every((s) => s != null && s >= 400 && s !== 499)) return 'var(--danger)';
  return 'var(--warning)';
}
function renderBranchbar() {
  const ancHidden = (b) => {
    if (b.trunk) return false;
    let p = b.parent;
    while (p) { const ab = state.branches.find((x) => !x.trunk && x.node === p); if (ab && state.sel[ab.id] === false) return true; p = p.parent; }
    return false;
  };
  const trunkCount = state.branches.filter((b) => b.trunk).length;
  let h = `<div class="bh"><b>分支 ${state.branches.length} 条（含 ${trunkCount} 主干）</b><button id="ball">全选</button><button id="bnone">只看主干</button></div>`;
  if (state.outOfWindow) h += `<div class="traj-note2">${state.outOfWindow} 轮在 500 轮取证窗口外，未入图。</div>`;
  for (const b of state.branches) {
    const dis = ancHidden(b);
    const checked = !dis && state.sel[b.id] !== false;
    const pv = state.previewByNode.get(b.node.id);
    const meta = b.trunk
      ? `主干（最长）· ${b.count} 状态 · ${fmtTime(b.ts)}起`
      : `⎇ 第 ${b.forkAt} 条分出 · ${b.count} 状态 · ${fmtTime(b.ts)}起`;
    h += `<label class="bitem${dis ? ' off' : ''}" data-b="${esc(b.id)}" style="padding-left:${10 + b.depth * 12}px">` +
      `<input type="checkbox" ${checked ? 'checked' : ''}${dis ? ' disabled' : ''}>` +
      `<span class="tx"><span class="l1">${esc((b.trunk ? '★ ' : '') + (pv || b.label || '').slice(0, 42))}</span><span class="l2">${meta}</span></span></label>`;
  }
  $('#traj-branchbar').innerHTML = h;
  $$('#traj-branchbar .bitem').forEach((el) => el.addEventListener('click', () => {
    const cb = el.querySelector('input');
    if (cb.disabled) return;
    state.sel[el.dataset.b] = cb.checked; // click 之后 input 已翻转，读新状态
    renderMain();
  }));
  $('#ball').addEventListener('click', () => { state.branches.forEach((b) => { state.sel[b.id] = true; }); renderMain(); });
  $('#bnone').addEventListener('click', () => { state.branches.forEach((b) => { state.sel[b.id] = !!b.trunk; }); renderMain(); });
}
const LANE_W = 26, ROW_H = 52, DOT_R = 7, LABEL_W = 320;
function renderTree() {
  const hide = hiddenSet();
  const visible = state.forest.nodes.filter((n) => !hide.has(n.id));
  const visIds = new Set(visible.map((n) => n.id));
  const kids = new Map(); // 可见子关系
  for (const n of visible) if (n.parent && visIds.has(n.parent.id)) (kids.get(n.parent.id) || kids.set(n.parent.id, []).get(n.parent.id)).push(n);
  if (!visible.length) { $('#traj-main').innerHTML = '<div class="empty" style="padding:20px;text-align:center">没有勾选任何链——至少勾一条。</div>'; return; }
  // 根 = 父不可见的节点（主干隐藏后各分支自成轨）；按所属树分组，一树一节
  const roots = visible.filter((n) => !n.parent || !visIds.has(n.parent.id));
  let out = '';
  for (const treeRoot of state.forest.roots) {
    const treeIds = subtreeOf(treeRoot);
    const treeRoots = roots.filter((r) => treeIds.has(r.id));
    if (!treeRoots.length) continue;
    out += treeSvg(kids, treeRoots);
  }
  $('#traj-main').innerHTML = out || '<div class="empty">没有可展示的轮次</div>';
  $$('#gtraj-svg g.nodeg').forEach((g) => g.addEventListener('click', () => openDrawerForNode(Number(g.dataset.node))));
  markCur();
}
// 树根的全部后代 id 集
const subtreeCache = new Map();
function subtreeOf(root) {
  if (subtreeCache.has(root.id)) return subtreeCache.get(root.id);
  const ids = new Set(); const stack = [root];
  while (stack.length) { const n = stack.pop(); if (ids.has(n.id)) continue; ids.add(n.id); n.children.forEach((c) => stack.push(c)); }
  subtreeCache.set(root.id, ids); return ids;
}
function treeSvg(kids, rootsRaw) {
  const roots = rootsRaw.slice().sort((a, b) => a.turns[0].ts - b.turns[0].ts);
  const tn = [], stack = roots.slice().reverse();
  while (stack.length) { const n = stack.pop(); if (tn.some((x) => x.id === n.id)) continue; tn.push(n); (kids.get(n.id) || []).slice().reverse().forEach((c) => stack.push(c)); }
  tn.sort((a, b) => a.turns[0].ts - b.turns[0].ts);
  const sizes = state.forest.sizes;
  const lane = new Map(); let nextLane = 0;
  for (const r of roots) lane.set(r.id, nextLane++);
  for (const n of tn) {
    const kk = (kids.get(n.id) || []).slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id));
    kk.forEach((c, i) => lane.set(c.id, i === 0 ? lane.get(n.id) : nextLane++));
  }
  const nLanes = Math.max(1, nextLane);
  const yOf = new Map(); tn.forEach((n, i) => yOf.set(n.id, i));
  const H = tn.length * ROW_H + 12, LW = 16 + nLanes * LANE_W;
  const lx = (l) => 16 + l * LANE_W;
  let svg = `<div class="gwrap"><svg id="gtraj-svg" width="${LW + LABEL_W}" height="${H}" font-family="var(--mono)">`;
  // 轨道
  const laneRows = new Map();
  for (const n of tn) { const l = lane.get(n.id); (laneRows.get(l) || laneRows.set(l, []).get(l)).push(yOf.get(n.id)); }
  for (const [l, ys] of laneRows) { ys.sort((a, b) => a - b); if (ys.length > 1) svg += `<line x1="${lx(l)}" y1="${ys[0] * ROW_H + 30}" x2="${lx(l)}" y2="${ys[ys.length - 1] * ROW_H + 30}" stroke="${railCol(l)}" stroke-width="1.5" opacity="0.5"/>`; }
  // 分叉曲线
  for (const n of tn) for (const c of (kids.get(n.id) || [])) {
    if (lane.get(c.id) === lane.get(n.id)) continue;
    const x1 = lx(lane.get(n.id)), y1 = yOf.get(n.id) * ROW_H + 30, x2 = lx(lane.get(c.id)), y2 = yOf.get(c.id) * ROW_H + 30;
    svg += `<path d="M${x1} ${y1} C${x1} ${y1 + 20} ${x2} ${y2 - 20} ${x2} ${y2}" stroke="${railCol(lane.get(c.id))}" stroke-width="1.5" fill="none" opacity="0.85"/>`;
  }
  // 节点
  for (const n of tn) {
    const y = yOf.get(n.id) * ROW_H + 30, x = lx(lane.get(n.id));
    const ns = n.turns.length, dotR = DOT_R + (ns > 1 ? 2 : 0);
    const dots = n.turns.map((t) => { const r = state.statusByCapture.get(t.capture_id); return r ? r.status : null; });
    svg += `<g class="nodeg" data-node="${n.id}">`;
    svg += `<rect class="hitrect" x="0" y="${y - ROW_H / 2 + 8}" width="${LW + LABEL_W}" height="${ROW_H}" fill="transparent"/>`;
    if (ns > 1) svg += `<rect x="${x - 24}" y="${y - dotR - 13}" width="28" height="13" rx="6" fill="${retryColor(n.turns)}"/><text x="${x - 10}" y="${y - dotR - 3}" font-size="9" fill="var(--surface)" text-anchor="middle" font-weight="700">×${ns}</text>`;
    svg += `<circle class="dot" cx="${x}" cy="${y}" r="${dotR}" fill="${railCol(lane.get(n.id))}" stroke="var(--surface)" stroke-width="1.5"/>`;
    if ((kids.get(n.id) || []).length > 1) svg += `<path d="M${x + dotR + 2} ${y - 4} l6 4 l-6 4 z" fill="var(--warning)"/>`;
    const t0 = n.turns[0], tN = n.turns[ns - 1];
    let l1 = `<text x="${LW + 4}" y="${y - 3}" font-size="10"><tspan fill="var(--muted)">${fmtTime(t0.ts)}${ns > 1 ? ' → ' + fmtTime(tN.ts) : ''}</tspan>`;
    if (ns > 1) l1 += `<tspan fill="${retryColor(n.turns)}" dx="7">${dots.map(() => '●').join('')}</tspan>`;
    const lastStatus = state.statusByCapture.get(tN.capture_id)?.status;
    l1 += `<tspan fill="${stCol(lastStatus)}" dx="7">${lastStatus ?? '—'}</tspan>`;
    l1 += `<tspan fill="var(--muted)" dx="7">${Math.round(tN.bytes / 1024)}KB·${n.refs.length}条</tspan></text>`;
    // 第二行：新增了什么——优先已知预览，否则角色 + 位置
    const parentLen = n.parent ? n.parent.refs.length : 0;
    const addedCount = n.refs.length - parentLen;
    const role = state.roleByHash.get(n.refs[parentLen]) ?? (n.parent ? '?' : 'S');
    const pv = state.previewByNode.get(n.id);
    const l2 = pv ? esc(pv.slice(0, 44)) + (pv.length > 44 ? '…' : '')
      : (n.parent ? `[${role}] 第 ${parentLen + 1} 条起 +${addedCount}` : '[S] 线程起点');
    svg += l1;
    svg += `<text x="${LW + 4}" y="${y + 12}" font-size="11" fill="var(--text-2)">${l2}</text>`;
    svg += `</g>`;
  }
  svg += '</svg></div>';
  return svg;
}
/* 链根预览：懒取正文（链数通常个位数） */
async function loadPreviews() {
  const want = state.branches.filter((b) => !state.previewByNode.has(b.node.id) && !state.previewByNode.has('pend:' + b.node.id));
  for (const b of want.slice(0, 12)) {
    state.previewByNode.set('pend:' + b.node.id, 1);
    try {
      const n = b.node;
      const parentLen = n.parent ? n.parent.refs.length : 0;
      const data = await fetchJson(`/api/capture/turns/${n.turns[0].id}`);
      const msgs = data.body?.messages || [];
      for (let i = 0; i < msgs.length && i < (data.refs || []).length; i++) state.roleByHash.set(data.refs[i], String(msgs[i].role ?? '?'));
      const added = msgs.slice(parentLen)
        .filter((m) => { const r = String(m.role ?? ''); return r === 'user' || r === 'assistant'; })
        .map((m) => {
          const c = typeof m.content === 'string' ? m.content : Array.isArray(m.content) ? m.content.filter((p) => p?.type === 'text').map((p) => p.text).join(' ') : '';
          return String(c).replace(/\s+/g, ' ').trim();
        }).filter(Boolean).slice(0, 2).join(' ／ ');
      state.previewByNode.set(n.id, added || `+${n.refs.length - parentLen} 条（无文本）`);
    } catch { /* 预览失败不挡轨迹 */ }
  }
  if (state.view === 'tree' && state.forest) { renderBranchbar(); renderTree(); markCur(); }
}

/* ---- 会话数据装载 ---- */
async function loadTurns(identity, tenant) {
  state.identity = identity; state.tenant = tenant;
  state.turnId = null; state.chainByTurn = new Map();
  state.chain = []; state.forest = null; state.branches = []; state.sel = {};
  state.statusByCapture = new Map(); state.roleByHash = new Map(); state.previewByNode = new Map(); subtreeCache.clear();
  closeDrawer();
  const [turns, forensics] = await Promise.all([
    fetchJson(`/api/capture/turns?identity=${encodeURIComponent(identity)}&tenant=${encodeURIComponent(tenant)}&limit=500`),
    fetchJson(`/api/capture/cache-forensics?identity=${encodeURIComponent(identity)}&tenant=${encodeURIComponent(tenant)}&limit=500`).catch(() => null),
  ]);
  state.turns = turns.turns || [];
  if (forensics) {
    state.chain = forensics.chain || [];
    for (const e of state.chain) state.chainByTurn.set(e.id, e);
  }
  state.outOfWindow = state.turns.length - state.chain.length;
  const threadLabels = new Map((forensics?.threads || []).map((th) => [th.key, th.label]));
  const sinceTs = state.chain.length ? state.chain[0].ts : 0;
  buildForest(state.chain, threadLabels);
  loadStatuses(tenant, identity, sinceTs).then(() => renderMain()).catch(() => {});
  loadFamilyHeader(state.turns).catch(() => {});
  loadPreviews().catch(() => {});
  renderMain();
}

/* ---- 抽屉：正文浮层（树节点 / 列表行共用；×N 节点顶部带尝试切换条） ---- */
function renderMessage(msg, index, prevRefs, refHash) {
  const role = String(msg.role ?? '?');
  const dup = Array.isArray(prevRefs) && prevRefs.includes(refHash);
  const toolCalls = Array.isArray(msg.tool_calls) ? msg.tool_calls : [];
  const content = msg.content == null ? '' : typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content, null, 2);
  const toolTag = msg.tool_call_id ? ` · 回应 <span class="mono">${esc(msg.tool_call_id)}</span>` : '';
  const long = content.length > 600;
  return `<div class="msg">
    <div class="msg-head">
      <span class="role ${esc(role)}">${esc(role)}</span>
      <span class="kind">第 ${index + 1} 条</span>
      ${dup ? '<span class="dup">同上轮（缓存命中段）</span>' : '<span class="new">本轮新增</span>'}
      ${toolTag}
    </div>
    ${toolCalls.length ? `<div class="toolcalls">${toolCalls.map((tc) => {
      let pretty = tc.function?.arguments ?? '';
      try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch {}
      return `<div class="toolcall"><span class="fn">${esc(tc.function?.name ?? '?')}</span> 调用参数<pre>${esc(pretty)}</pre></div>`;
    }).join('')}</div>` : ''}
    ${content ? `<div class="msg-body${long ? ' clamped' : ''}">${esc(content)}</div>${long ? '<button class="toggle" type="button">展开全文 ▾</button>' : ''}` : ''}
  </div>`;
}

async function renderTurnIntoDrawer(id) {
  state.turnId = id;
  const chain = state.chainByTurn.get(id);
  const prevTurn = chain?.prev_in_thread_id != null ? state.turns.find((t) => t.id === chain.prev_in_thread_id) ?? null : null;
  const data = await fetchJson(`/api/capture/turns/${id}`);
  const prevRefs = prevTurn ? (await fetchJson(`/api/capture/turns/${prevTurn.id}`).catch(() => null))?.refs ?? null : null;
  const body = data.body || {};
  const messages = Array.isArray(body.messages) ? body.messages : [];
  const refs = data.refs || [];
  const idx = state.turns.findIndex((t) => t.id === id);
  $('#dtitle').textContent = `轮次 #${idx + 1} · model ${body.model ?? '—'} · ${messages.length} 条 · ${fmtBytes(data.turn?.bytes)} · capture ${fmtClock(data.turn?.ts)} · capture_id ${String(data.turn?.capture_id ?? '')}`;
  $('#dbody').innerHTML =
    `<div class="traj-note" style="padding:8px 14px">哈希引用列表（盐化）：${refs.length ? esc(refs[0].slice(0, 12)) + '… 等 ' + refs.length + ' 条' : '—'}</div>` +
    messages.map((m, i) => renderMessage(m, i, prevRefs, refs[i])).join('') || '<div class="empty" style="padding:20px">该轮正文缺失（降级状态）</div>';
  $$('.msg .toggle', $('#dbody')).forEach((btn) => btn.addEventListener('click', () => {
    const body2 = btn.previousElementSibling;
    body2.classList.toggle('clamped');
    btn.textContent = body2.classList.contains('clamped') ? '展开全文 ▾' : '收起 ▴';
  }));
  markCur();
}

function openDrawer() {
  $('#drawer').classList.remove('hidden');
  $('#drawer').setAttribute('aria-hidden', 'false');
}
function closeDrawer() {
  $('#drawer').classList.add('hidden');
  $('#drawer').setAttribute('aria-hidden', 'true');
}
$('#dclose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

async function openDrawerForTurn(turnId) {
  const n = state.forest?.nodes.find((x) => x.turns.some((t) => t.id === turnId));
  if (n) await openDrawerForNode(n.id, turnId);
  else { openDrawer(); $('#attempt-strip').hidden = true; await renderTurnIntoDrawer(turnId); }
}
async function openDrawerForNode(nodeId, preferTurnId) {
  const n = state.forest.byId.get(nodeId);
  if (!n || !n.turns.length) return;
  openDrawer();
  const strip = $('#attempt-strip');
  if (n.turns.length > 1) {
    strip.hidden = false;
    strip.innerHTML = '同一状态的尝试：' + n.turns.map((t, i) => {
      const r = state.statusByCapture.get(t.capture_id);
      return `<button data-turn="${t.id}" class="${t.id === state.turnId ? 'on' : ''}"><i style="background:${stCol(r?.status)}"></i>#${i + 1} ${r?.status ?? ''} ${fmtTime(t.ts)}</button>`;
    }).join('');
    $$('#attempt-strip button').forEach((btn) => btn.addEventListener('click', () => {
      $$('#attempt-strip button').forEach((b) => b.classList.remove('on'));
      btn.classList.add('on');
      renderTurnIntoDrawer(Number(btn.dataset.turn)).catch((err) => { $('#err').textContent = `正文加载失败：${err.message}`; });
    }));
  } else strip.hidden = true;
  const target = n.turns.find((t) => t.id === preferTurnId) ?? n.turns.find((t) => t.id === state.turnId) ?? n.turns[n.turns.length - 1];
  await renderTurnIntoDrawer(target.id);
}

/* ---- 事件 ---- */
$$('#main-bar .vswitch button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
$('#traj-sessions').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-identity]');
  if (!li) return;
  $$('#traj-sessions li').forEach((x) => x.classList.remove('active'));
  li.classList.add('active');
  loadTurns(li.dataset.identity, li.dataset.tenant).catch((err) => { $('#err').textContent = `轮次加载失败：${err.message}`; });
});
$('#f-search').addEventListener('input', () => loadSessions().catch(() => {}));

initChrome('trajectory.html').then(async () => {
  await loadSessions();
  const params = new URLSearchParams(location.search);
  const identity = params.get('identity');
  if (!identity) return;
  const li = $(`#traj-sessions li[data-identity="${CSS.escape(identity)}"]`);
  if (!li) { $('#err').textContent = `会话 ${identity} 不在最近 200 个会话里，请从列表里挑`; return; }
  $$('#traj-sessions li').forEach((x) => x.classList.remove('active'));
  li.classList.add('active');
  const captureId = params.get('capture_id');
  if (captureId) {
    // 从请求页跳来：定位该 capture_id 所在节点并直接开抽屉
    await loadTurns(identity, li.dataset.tenant);
    const turn = state.turns.find((t) => t.capture_id === captureId);
    const node = turn && state.forest ? state.forest.nodes.find((n) => n.turns.some((t) => t.id === turn.id)) : null;
    if (node) { setView('tree'); await openDrawerForNode(node.id, turn.id); }
    else { setView('list'); $('#err').textContent = `轮次 ${captureId.slice(0, 8)}… 不在最近 500 轮里（可能已过 TTL 清理）`; }
  } else await loadTurns(identity, li.dataset.tenant);
});
</script>
