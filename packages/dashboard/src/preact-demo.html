<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基座自检 · LLM CPR 后台</title>
<link rel="stylesheet" href="/assets/app.css">
<!-- preact + htm 基座：vendor 三文件（.js 后缀——core 静态白名单无 .mjs，ESM 不在乎扩展名）+ 裸模块名映射（hooks.js 内部 import "preact"） -->
<script type="importmap">
{"imports":{"preact":"/assets/vendor/preact.js","preact/hooks":"/assets/vendor/hooks.js","htm":"/assets/vendor/htm.js"}}
</script>
<style>
/* 本页专属：正式 settings 页会重写，这里只求自检看得清 */
#app h2{margin:18px 0 6px;font-size:16px}
.demo-row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.demo-row button{cursor:pointer}
.demo-row input{padding:4px 8px;background:var(--surface-soft);color:var(--text);border:1px solid var(--border);border-radius:0}
.demo-row .ok{color:var(--success);font-size:13px}
.err-text{color:var(--danger)}
</style>
</head>
<body>
<main><div id="app"></div></main>
<script src="/assets/app.js"></script>
<script type="module" src="/assets/demo/index.js"></script>
</body>
</html>
