<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轨迹 · LLM CPR 后台</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
/* trajectory-gitgraph v4：树/列表融合成一张 git-graph 式清单（参考 git graph 扩展）。
   每行 = 泳道切片 SVG（圆点+轨道竖线+分叉斜线）+ 彩色角色 pill + 一句话摘要；
   点行在图内原地展开该轮新增的正文（不再弹整条消息数组的抽屉）；
   分支选择收成顶部一排小 chips（点 chip 显隐分支，主干 = 最长链也算一条）。 */
.traj{grid-template-columns:230px 1fr}
#pane-main{min-width:0}
#main-bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
#main-bar .fam{font-size:11px;color:var(--muted);flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#traj-branchbar{border-bottom:1px solid var(--border);font-size:12px}
#traj-branchbar .bh{display:flex;gap:8px;align-items:center;padding:5px 10px 2px}
#traj-branchbar .bh b{font-size:11px;color:var(--text-2)}
#traj-branchbar .bh button{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:11px}
#traj-branchbar .bh button:hover{color:var(--text);border-color:var(--border-strong)}
.bchips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 7px}
.bchip{display:inline-flex;align-items:center;gap:5px;max-width:250px;background:none;border:1px solid var(--border);border-radius:20px;padding:1px 9px 1px 7px;cursor:pointer;font-size:11px;color:var(--text-2)}
.bchip i{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.bchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bchip em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
.bchip.on{border-color:var(--border-strong);color:var(--text)}
.bchip.off{opacity:.35}
.bchip.dis{opacity:.22;cursor:default}
.traj-note2{padding:5px 10px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border)}
/* 图行：泳道切片 + 两行内容（摘要 / 元信息），行高固定保证竖线切片对齐 */
.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.grow:hover,.grow.cur{background:var(--hover)}
.grow .rail{flex-shrink:0;display:block}
.gcell{flex:1;min-width:0;padding:6px 10px 5px 0}
.gl1{display:flex;gap:7px;align-items:center;height:18px;min-width:0}
.pill{flex-shrink:0;color:var(--surface);border-radius:5px;padding:0 6px;font-size:10px;font-weight:700;line-height:15px;min-width:34px;text-align:center;text-transform:lowercase}
.gsum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text)}
.xb{flex-shrink:0;font-size:10px;font-family:var(--mono);border:1px solid var(--border);border-radius:6px;padding:0 5px}
.gl2{display:flex;gap:8px;align-items:center;height:15px;font-size:10px;color:var(--muted);font-family:var(--mono);min-width:0;margin-top:2px}
.gl2 .tm,.gl2 .stt,.gl2 .sp{flex-shrink:0}
.gl2 .stt{font-weight:700}
.gl2 .tk{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 行内展开：正文面板（只装该轮新增的消息） */
.gdetail{border-bottom:1px solid var(--border);background:var(--hover);display:flex;min-width:0}
.gdetail .railc{position:relative;flex-shrink:0}
.rv{position:absolute;top:0;bottom:0;width:1.5px;opacity:.45}
.gbody{flex:1;min-width:0;padding:6px 10px 12px 0}
.phead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 0 6px}
.phead .pnum{font-weight:700;color:var(--text-2)}
.phead .pmeta{font-family:var(--mono);font-size:10px}
.ptgl{margin-left:auto;display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.ptgl button{background:none;border:none;color:var(--muted);font-size:10px;padding:2px 9px;cursor:pointer}
.ptgl button.on{color:var(--text);background:var(--surface)}
.pstrip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0 6px;font-size:11px;color:var(--muted)}
.pstrip button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:11px;font-family:var(--mono)}
.pstrip button.on{color:var(--text);border-color:var(--border-strong);background:var(--surface)}
.pstrip i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.pload{padding:10px 0;font-size:12px;color:var(--muted)}
.pmsg{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.pmsg .msg{padding:8px 12px}
.pmsg pre{max-height:240px;overflow:auto}
@media (max-width:760px){.traj{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h2>轨迹查看器</h2>
<p class="muted" style="font-size:12px;margin:0 0 4px">
  会话内每条请求是往同一棵「消息前缀树」上走一步：节点 = 一个消息前缀（对话状态），连线 = 追加消息，
  分叉 = 同一前缀拐出不同走向，同一前缀的重试收进 ×N 节点。左列挑会话 → 右侧一张 git-graph 式清单
  （树即列表）：每行一句摘要说明这条消息干了什么，点行在图内直接展开该轮新增的正文；
  分支收成顶部一排 chips，点 chip 显隐对应分支（主干 = 最长链，也是一条分支）。
</p>
<div class="toolbar">
  <input id="f-search" type="search" placeholder="会话 ID 过滤…" autocomplete="off">
</div>
<div id="err"></div>
<div class="traj">
  <section id="pane-sessions">
    <h3>会话（有捕获的）</h3>
    <ul id="traj-sessions"></ul>
  </section>
  <section id="pane-main">
    <div id="main-bar"><div class="fam" id="traj-family">挑一个会话</div></div>
    <div id="traj-branchbar" hidden></div>
    <div id="traj-main"><div class="empty" style="padding:20px;text-align:center">选一个会话</div></div>
  </section>
</div>
</main>

<script src="/assets/app.js"></script>
<script>
'use strict';
const state = { sessions: [], identity: null, tenant: null, turns: [], turnId: null,
  chainByTurn: new Map(), chain: [], forest: null, branches: [], sel: {}, statusByCapture: new Map(),
  roleByHash: new Map(), previewByNode: new Map(), outOfWindow: 0,
  expanded: new Set(), attempt: new Map(), panelAll: new Map(), bodies: new Map(), pvPending: new Set(), graph: null };
// 泳道配色（亮暗两套主题下都可见）。
const RAILS = ['#3fae7a', '#d29a3a', '#5b8def', '#9a6fd0', '#d05b6a', '#3a9ad2', '#7aa23f', '#b06fd0'];
const LANE_W = 22, ROW_H = 46, DOT_R = 6, DOT_Y = 16, RAIL_PAD = 14, MAX_LANES = 8;
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString('zh-CN', { hour12: false }) : '—';
const stCol = (s) => s == null ? 'var(--muted)' : (s < 300 ? 'var(--success)' : s === 499 ? 'var(--muted)' : 'var(--danger)');
const ROLE_COL = { user: 'var(--accent-bright, #5b8def)', assistant: 'var(--success)', tool: 'var(--muted)', system: 'var(--warning)' };

/* ---- 左列：会话清单（不变） ---- */
async function loadSessions() {
  const q = $('#f-search').value.trim().toLowerCase();
  const data = await fetchJson(withTenant('/api/audit/sessions?page=1&page_size=200&sort=last_ts&order=desc'));
  state.sessions = (data.sessions || []).filter((s) => !q || String(s.identity).toLowerCase().includes(q));
  $('#traj-sessions').innerHTML = state.sessions.map((s) => `
    <li data-identity="${esc(s.identity)}" data-tenant="${esc(s.tenant || 'default')}">
      <div class="who">${esc(s.identity)}</div>
      <div class="meta">${esc(s.tenant || 'default')} · ${s.requests} 请求 · ${rel(s.last_ts)}</div>
    </li>`).join('') || '<li class="empty">没有匹配的会话</li>';
}

/* 主面板顶部：家族徽标 + 缓存效率（family-observability 票 03，压缩进一行）。 */
async function loadFamilyHeader(turns) {
  const threadKeys = new Set();
  for (const entry of state.chainByTurn.values()) threadKeys.add(entry.thread_key);
  let line1 = `<b>${threadKeys.size > 1 ? 'deleg 家族' : '单线程'}</b> · ${threadKeys.size || '?'} 线程 · ${turns.length} 轮`;
  $('#traj-family').innerHTML = line1;
  if (!state.identity) return;
  try {
    const eff = await fetchJson(`/api/capture/cache-efficiency?identity=${encodeURIComponent(state.identity)}&tenant=${encodeURIComponent(state.tenant)}&limit=500`);
    const pct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const k = (v) => v == null ? '—' : v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    $('#traj-family').innerHTML =
      `${line1} · 效率 <b>${pct(eff.totals?.efficiency)}</b> · 浪费 ${pct(eff.totals?.waste_share)} · 重读 ×${k(eff.totals?.read_multiplier)} · ~${k(eff.totals?.corpus_tokens_est)} tok${eff.totals?.turns_skipped_no_usage ? ` · ${eff.totals.turns_skipped_no_usage} 轮无 usage` : ''}`;
  } catch { /* 效率条失败不挡轨迹 */ }
}

/* ---- 账本状态：按 capture_id 对回 status/ttft（分页拉到盖住最早轮次为止） ---- */
async function loadStatuses(tenant, identity, sinceTs) {
  state.statusByCapture = new Map();
  for (let page = 1; page <= 20; page++) {
    const data = await fetchJson(`/api/audit/requests?tenant=${encodeURIComponent(tenant)}&identity=${encodeURIComponent(identity)}&page=${page}&page_size=200`);
    const rows = data.requests || [];
    if (!rows.length) break;
    for (const r of rows) if (r.capture_id) state.statusByCapture.set(r.capture_id, r);
    if (rows.length < 200 || Math.min(...rows.map((r) => r.ts)) < sinceTs - 60_000) break;
  }
}

/* ---- 前缀森林：节点 = 一个 refs 前缀；同一前缀的轮次收进同一节点 ---- */
function buildForest(chain, threadLabels) {
  const trie = new Map(); // refs.join('\u0000') -> node
  const nodes = [];
  for (const entry of chain) {
    const refs = entry.refs || [];
    if (!refs.length) continue;
    let parent = null;
    for (let l = refs.length - 1; l >= 1; l--) {
      const p = trie.get(refs.slice(0, l).join('\u0000'));
      if (p) { parent = p; break; }
    }
    const key = refs.join('\u0000');
    let node = trie.get(key);
    if (!node) {
      node = { id: nodes.length, refs, parent, children: [], turns: [], threadKey: entry.thread_key };
      nodes.push(node); trie.set(key, node);
      if (parent) parent.children.push(node);
    }
    node.turns.push(entry);
    // 角色表：链条目已知「第 N 条起分歧，角色 X」→ 记 hash→role。
    if (entry.first_diff_in_thread_index != null && entry.first_diff_in_thread_role)
      state.roleByHash.set(refs[entry.first_diff_in_thread_index], entry.first_diff_in_thread_role);
  }
  // 子树规模 + 主干（每棵树从根起反复走「子孙最多」的孩子）
  const sizes = new Map();
  const sizeOf = (n) => {
    if (sizes.has(n.id)) return sizes.get(n.id);
    sizes.set(n.id, 1); // 防环占位（refs 前缀树天然无环，稳妥起见）
    const total = 1 + n.children.reduce((s, c) => s + sizeOf(c), 0);
    sizes.set(n.id, total);
    return total;
  };
  const roots = nodes.filter((n) => !n.parent);
  const trunks = new Map(); // treeRootId -> [nodeIds]
  for (const root of roots) {
    sizeOf(root);
    const path = [];
    let cur = root;
    while (cur) { path.push(cur.id); const kids = cur.children.slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id)); cur = kids[0] || null; }
    trunks.set(root.id, path);
  }
  // 分支 = 分叉点上非主干的每个孩子
  const branches = [];
  const walk = (n, treeRoot, depth) => {
    const kk = n.children.slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id));
    kk.forEach((c, i) => {
      if (i > 0) branches.push({ id: String(c.id), parent: n, node: c, treeRoot, forkAt: n.refs.length + 1, count: sizes.get(c.id), ts: c.turns[0].ts, depth: depth + 1 });
      walk(c, treeRoot, i > 0 ? depth + 1 : depth);
    });
  };
  for (const root of roots) {
    const label = threadLabels.get(root.threadKey) ?? root.threadKey.slice(0, 12);
    branches.push({ id: 'trunk-' + root.id, trunk: true, node: root, treeRoot: root, count: trunks.get(root.id).length, ts: root.turns[0].ts, depth: 0, label });
    walk(root, root, 0);
  }
  branches.sort((a, b) => (a.trunk ? -1 : b.trunk ? 1 : a.ts - b.ts));
  state.forest = { nodes, roots, sizes, trunks, byId: new Map(nodes.map((n) => [n.id, n])) };
  state.branches = branches;
}

/* ---- 可见图：泳道全局分配（跨树连续，chips 颜色与轨道一致）、行序按 ts ---- */
function visibleGraph() {
  const hide = hiddenSet();
  const visible = state.forest.nodes.filter((n) => !hide.has(n.id));
  const visIds = new Set(visible.map((n) => n.id));
  const kids = new Map();
  for (const n of visible) if (n.parent && visIds.has(n.parent.id)) (kids.get(n.parent.id) || kids.set(n.parent.id, []).get(n.parent.id)).push(n);
  const roots = visible.filter((n) => !n.parent || !visIds.has(n.parent.id));
  const sizes = state.forest.sizes;
  let nextLane = 0;
  const laneOf = new Map(), order = [];
  for (const treeRoot of state.forest.roots) {
    const treeIds = subtreeOf(treeRoot);
    const treeRoots = roots.filter((r) => treeIds.has(r.id)).sort((a, b) => a.turns[0].ts - b.turns[0].ts);
    if (!treeRoots.length) continue;
    const tn = [], stack = treeRoots.slice().reverse();
    while (stack.length) {
      const n = stack.pop();
      if (tn.some((x) => x.id === n.id)) continue;
      tn.push(n);
      (kids.get(n.id) || []).slice().reverse().forEach((c) => stack.push(c));
    }
    for (const r of treeRoots) laneOf.set(r.id, nextLane++);
    for (const n of tn) {
      const kk = (kids.get(n.id) || []).slice().sort((a, b) => sizes.get(b.id) - sizes.get(a.id));
      kk.forEach((c, i) => laneOf.set(c.id, i === 0 ? laneOf.get(n.id) : nextLane++));
    }
    order.push(...tn);
  }
  order.sort((a, b) => a.turns[0].ts - b.turns[0].ts);
  const rowOf = new Map(order.map((n, i) => [n.id, i]));
  const edges = [];
  for (const n of order) for (const c of (kids.get(n.id) || [])) edges.push({ pl: laneOf.get(n.id), cl: laneOf.get(c.id), pr: rowOf.get(n.id), cr: rowOf.get(c.id) });
  const gapV = new Map(); // 行间隙 -> 该间隙穿过的竖线泳道集（同道父子边）
  for (const e of edges) if (e.pl === e.cl && e.cr > e.pr) for (let g = e.pr; g < e.cr; g++) (gapV.get(g) || gapV.set(g, new Set()).get(g)).add(e.pl);
  return { order, laneOf, kids, edges, gapV, nLanes: Math.max(1, nextLane) };
}

/* ---- 主面板 ---- */
function renderMain() {
  if (!state.forest) return;
  $('#traj-branchbar').hidden = false;
  state.graph = visibleGraph();
  const scrollY = window.scrollY; // 状态异步补拉等触发的重绘不丢滚动位置
  renderBranchbar();
  renderRows();
  window.scrollTo(0, scrollY);
  markCur();
}
function markCur() {
  $$('#traj-main .grow').forEach((el) => {
    const n = state.forest.byId.get(Number(el.dataset.node));
    el.classList.toggle('cur', !!n && n.turns.some((t) => t.id === state.turnId));
  });
}

/* ---- 分支 chips（紧凑条，点 chip 显隐分支） ---- */
function renderBranchbar() {
  const ancHidden = (b) => {
    if (b.trunk) return false;
    let p = b.parent;
    while (p) { const ab = state.branches.find((x) => !x.trunk && x.node === p); if (ab && state.sel[ab.id] === false) return true; p = p.parent; }
    return false;
  };
  let chips = '';
  for (const b of state.branches) {
    const dis = ancHidden(b);
    const on = !dis && state.sel[b.id] !== false;
    const pv = state.previewByNode.get(b.node.id);
    const label = b.trunk ? '★ 主干' : (pv || b.label || `分支 ${b.id}`).slice(0, 14);
    const meta = b.trunk
      ? `主干（最长链）· ${b.count} 状态 · ${fmtTime(b.ts)} 起`
      : `⎇ 自第 ${b.forkAt} 条分出 · ${b.count} 状态 · ${fmtTime(b.ts)} 起`;
    const lane = state.graph.laneOf.get(b.node.id);
    const col = on && lane != null ? railCol(lane) : 'var(--muted)';
    chips += `<button class="bchip${dis ? ' dis' : on ? ' on' : ' off'}" data-b="${esc(b.id)}"${dis ? ' disabled' : ''} title="${esc(meta)}">` +
      `<i style="background:${col}"></i><span>${esc(label)}</span><em>${b.count}</em></button>`;
  }
  $('#traj-branchbar').innerHTML =
    (state.outOfWindow ? `<div class="traj-note2">${state.outOfWindow} 轮在 500 轮取证窗口外，未入图。</div>` : '') +
    `<div class="bh"><b>分支 ${state.branches.length}（含主干）</b><button id="ball">全选</button><button id="bnone">只看主干</button></div><div class="bchips">${chips}</div>`;
  $$('#traj-branchbar .bchip').forEach((el) => el.addEventListener('click', () => {
    if (el.disabled) return;
    state.sel[el.dataset.b] = !el.classList.contains('on'); // off→on / on→off
    renderMain();
  }));
  $('#ball').addEventListener('click', () => { state.branches.forEach((b) => { state.sel[b.id] = true; }); renderMain(); });
  $('#bnone').addEventListener('click', () => { state.branches.forEach((b) => { state.sel[b.id] = !!b.trunk; }); renderMain(); });
}

/* ---- 隐藏集 / 泳道色 ---- */
function hiddenSet() {
  const hide = new Set();
  for (const [id, on] of Object.entries(state.sel)) {
    if (on) continue;
    const b = state.branches.find((x) => x.id === id);
    if (!b) continue;
    if (b.trunk) { for (const nid of state.forest.trunks.get(b.treeRoot.id)) hide.add(nid); continue; }
    const stack = [b.node];
    while (stack.length) { const n = stack.pop(); if (hide.has(n.id)) continue; hide.add(n.id); n.children.forEach((c) => stack.push(c)); }
  }
  return hide;
}
function railCol(l) { return RAILS[l % RAILS.length]; }
function retryColor(list) {
  const st = list.map((t) => { const r = state.statusByCapture.get(t.capture_id); return r ? r.status : null; });
  if (st.length && st.every((s) => s != null && s < 300)) return 'var(--success)';
  if (st.length && st.every((s) => s != null && s >= 400 && s !== 499)) return 'var(--danger)';
  return 'var(--warning)';
}
// 树根的全部后代 id 集
const subtreeCache = new Map();
function subtreeOf(root) {
  if (subtreeCache.has(root.id)) return subtreeCache.get(root.id);
  const ids = new Set(); const stack = [root];
  while (stack.length) { const n = stack.pop(); if (ids.has(n.id)) continue; ids.add(n.id); n.children.forEach((c) => stack.push(c)); }
  subtreeCache.set(root.id, ids); return ids;
}

/* ---- git-graph 清单：每行 = 泳道切片 SVG + 角色 pill + 摘要；点行图内展开 ---- */
function renderRows() {
  const g = state.graph;
  if (!g.order.length) { $('#traj-main').innerHTML = '<div class="empty" style="padding:20px;text-align:center">没有可展示的轮次</div>'; return; }
  const RAILW = RAIL_PAD * 2 + Math.min(g.nLanes, MAX_LANES) * LANE_W;
  const cx = (l) => RAIL_PAD + Math.min(l, MAX_LANES - 1) * LANE_W + LANE_W / 2;
  const lerpX = (e, t) => cx(e.pl) + (cx(e.cl) - cx(e.pl)) * (t - e.pr) / (e.cr - e.pr);
  let html = state.outOfWindow ? `<div class="traj-note2">${state.outOfWindow} 轮在 500 轮取证窗口外（编号按窗口内）。</div>` : '';
  g.order.forEach((n, r) => {
    const ns = n.turns.length, tN = n.turns[ns - 1], t0 = n.turns[0];
    const parentLen = n.parent ? n.parent.refs.length : 0;
    const addedCount = n.refs.length - parentLen;
    const role = String(state.roleByHash.get(n.refs[parentLen]) ?? (n.parent ? '?' : 'S')).toLowerCase();
    const pv = state.previewByNode.get(n.id);
    const fallback = n.parent ? `[${role}] 第 ${parentLen + 1} 条起 +${addedCount}` : '[S] 线程起点';
    const lastStatus = state.statusByCapture.get(tN.capture_id)?.status;
    // 泳道切片：轨道竖线 + 分叉斜线 + 圆点 + 分叉三角
    let s = `<svg class="rail" width="${RAILW}" height="${ROW_H}" aria-hidden="true">`;
    const L = g.laneOf.get(n.id);
    if (r > 0 && g.gapV.get(r - 1)?.has(L)) s += `<line x1="${cx(L)}" y1="0" x2="${cx(L)}" y2="${DOT_Y}" stroke="${railCol(L)}" stroke-width="1.5" opacity="0.5"/>`;
    if (r < g.order.length - 1 && g.gapV.get(r)?.has(L)) s += `<line x1="${cx(L)}" y1="${DOT_Y}" x2="${cx(L)}" y2="${ROW_H}" stroke="${railCol(L)}" stroke-width="1.5" opacity="0.5"/>`;
    for (const e of g.edges) {
      if (e.pl === e.cl || e.pr > r || e.cr < r) continue;
      const x1 = e.pr === r ? cx(e.pl) : lerpX(e, r), y1 = e.pr === r ? DOT_Y : 0;
      const x2 = e.cr === r ? cx(e.cl) : lerpX(e, r + 1), y2 = e.cr === r ? DOT_Y : ROW_H;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${railCol(e.cl)}" stroke-width="1.5" opacity="0.85"/>`;
    }
    const dotR = DOT_R + (ns > 1 ? 2 : 0);
    s += `<circle cx="${cx(L)}" cy="${DOT_Y}" r="${dotR}" fill="${railCol(L)}" stroke="var(--surface)" stroke-width="1.5"/>`;
    if ((g.kids.get(n.id) || []).length > 1) s += `<path d="M${cx(L) + dotR + 3} ${DOT_Y - 4} l6 4 l-6 4 z" fill="var(--warning)"/>`;
    s += '</svg>';
    html += `<div class="grow" data-node="${n.id}">${s}` +
      `<div class="gcell">` +
      `<div class="gl1"><span class="pill" id="pl-${n.id}" style="background:${ROLE_COL[role] ?? 'var(--muted)'}">${esc(role)}</span>` +
      `<span class="gsum" id="pv-${n.id}">${esc(pv ? pv.slice(0, 90) : fallback)}</span>` +
      (ns > 1 ? `<span class="xb" style="color:${retryColor(n.turns)};border-color:${retryColor(n.turns)}">×${ns}</span>` : '') +
      `</div>` +
      `<div class="gl2"><span class="tm">${fmtTime(tN.ts)}</span><span class="stt" style="color:${stCol(lastStatus)}">${lastStatus ?? '—'}</span>` +
      `<span class="sp">+${addedCount}</span><span class="sp">${Math.round(tN.bytes / 1024)}KB</span>` +
      (ns > 1 ? `<span class="sp">${fmtTime(t0.ts)}→</span>` : '') +
      `<span class="tk">${esc(String(n.threadKey ?? '').slice(0, 14))}</span></div></div></div>`;
    if (state.expanded.has(n.id)) html += `<div class="gdetail" data-node="${n.id}"><div class="railc" style="width:${RAILW}px">` + railCont(r, RAILW) + `</div><div class="gbody"><div class="pload">加载中…</div></div></div>`;
  });
  $('#traj-main').innerHTML = html;
  $$('#traj-main .grow').forEach((el) => el.addEventListener('click', () => toggleNode(Number(el.dataset.node))));
  for (const id of state.expanded) {
    const row = $(`#traj-main .grow[data-node="${id}"]`);
    const panel = $(`#traj-main .gdetail[data-node="${id}"]`);
    const n = state.forest.byId.get(id);
    if (row && panel && n) loadPanel(n, panel); // 展开态重渲染后回填（正文走缓存）
  }
}
// 展开面板左缘的轨道延续：该行间隙里穿过的竖线用绝对定位 div 拉满整块高度
function railCont(r, railw) {
  const g = state.graph;
  const cx = (l) => RAIL_PAD + Math.min(l, MAX_LANES - 1) * LANE_W + LANE_W / 2;
  let h = `<svg width="${railw}" height="${ROW_H}" aria-hidden="true">`;
  const set = g.gapV.get(r) || new Set();
  for (const e of g.edges) if (e.pl !== e.cl && e.pr <= r && e.cr >= r + 1) {
    const x1 = cx(e.pl) + (cx(e.cl) - cx(e.pl)) * (r + 1 - e.pr) / (e.cr - e.pr);
    const x2 = e.cr === r + 1 ? cx(e.cl) : cx(e.pl) + (cx(e.cl) - cx(e.pl)) * (r + 2 - e.pr) / (e.cr - e.pr);
    h += `<line x1="${x1}" y1="0" x2="${x2}" y2="${ROW_H}" stroke="${railCol(e.cl)}" stroke-width="1.5" opacity="0.85"/>`;
  }
  h += '</svg>';
  for (const l of set) if (l <= MAX_LANES - 1) h += `<i class="rv" style="left:${cx(l) - 0.75}px;background:${railCol(l)}"></i>`;
  return h;
}

/* ---- 行内展开：点行 → 面板装该轮新增的消息（默认），可切「全部消息」 ---- */
function toggleNode(nodeId) {
  const row = $(`#traj-main .grow[data-node="${nodeId}"]`);
  if (!row) return;
  const old = $(`#traj-main .gdetail[data-node="${nodeId}"]`);
  if (state.expanded.has(nodeId)) {
    state.expanded.delete(nodeId);
    row.classList.remove('open');
    if (old) old.remove();
    return;
  }
  state.expanded.add(nodeId);
  row.classList.add('open');
  const node = state.forest.byId.get(nodeId);
  if (!node) return;
  const RAILW = RAIL_PAD * 2 + Math.min(state.graph.nLanes, MAX_LANES) * LANE_W;
  const r = state.graph.order.findIndex((x) => x.id === nodeId);
  const panel = document.createElement('div');
  panel.className = 'gdetail'; panel.dataset.node = String(nodeId);
  panel.innerHTML = `<div class="railc" style="width:${RAILW}px">${railCont(r, RAILW)}</div><div class="gbody"><div class="pload">加载中…</div></div>`;
  row.after(panel);
  loadPanel(node, panel);
}
async function loadPanel(node, panel) {
  const ns = node.turns.length;
  const want = state.attempt.get(node.id) ?? node.turns[ns - 1].id;
  let data;
  try { data = await getBody(want); }
  catch (e) { if (panel.isConnected) panel.querySelector('.gbody').innerHTML = `<div class="pload">正文加载失败：${esc(e.message)}</div>`; return; }
  if (!panel.isConnected || panel.dataset.node !== String(node.id)) return;
  const parentLen = node.parent ? node.parent.refs.length : 0;
  const body = data.body || {};
  const messages = Array.isArray(body.messages) ? body.messages : [];
  const refs = data.refs || [];
  const idx = state.turns.findIndex((t) => t.id === want);
  const showAll = state.panelAll.get(node.id) === true;
  const head = `<div class="phead"><span class="pnum">轮次 #${idx + 1}</span><span>${esc(body.model ?? '—')}</span>` +
    `<span class="pmeta">${messages.length} 条 · ${fmtBytes(data.turn?.bytes)} · capture_id ${esc(String(data.turn?.capture_id ?? ''))}</span>` +
    `<span class="ptgl"><button data-pall="0" class="${showAll ? '' : 'on'}">只看新增</button><button data-pall="1" class="${showAll ? 'on' : ''}">全部消息</button></span></div>`;
  const strip = ns > 1 ? `<div class="pstrip">同一状态的尝试：` + node.turns.map((t, i) => {
    const r = state.statusByCapture.get(t.capture_id);
    return `<button data-attempt="${t.id}" class="${t.id === want ? 'on' : ''}"><i style="background:${stCol(r?.status)}"></i>#${i + 1} ${r?.status ?? ''} ${fmtTime(t.ts)}</button>`;
  }).join('') + '</div>' : '';
  const list = showAll
    ? messages.map((m, i) => ({ m, i, prev: refs.slice(0, parentLen) }))
    : messages.slice(parentLen).map((m, j) => ({ m, i: parentLen + j, prev: null }));
  const msgs = list.map((x) => renderMessage(x.m, x.i, x.prev, refs[x.i])).join('')
    || '<div class="empty" style="padding:14px">该轮正文缺失（降级状态）</div>';
  panel.querySelector('.gbody').innerHTML = head + strip + `<div class="pmsg">${msgs}</div>`;
  $$('.ptgl button', panel.querySelector('.gbody')).forEach((b) => b.addEventListener('click', () => {
    state.panelAll.set(node.id, b.dataset.pall === '1');
    loadPanel(node, panel);
  }));
  $$('[data-attempt]', panel.querySelector('.gbody')).forEach((b) => b.addEventListener('click', () => {
    state.attempt.set(node.id, Number(b.dataset.attempt));
    loadPanel(node, panel);
  }));
  $$('.msg .toggle', panel.querySelector('.gbody')).forEach((btn) => btn.addEventListener('click', () => {
    const body2 = btn.previousElementSibling;
    body2.classList.toggle('clamped');
    btn.textContent = body2.classList.contains('clamped') ? '展开全文 ▾' : '收起 ▴';
  }));
  state.turnId = want;
  markCur();
}

/* ---- 正文缓存 + 摘要（全部节点渐进懒取，改行内文本不重绘整图） ---- */
async function getBody(turnId) {
  if (state.bodies.has(turnId)) return state.bodies.get(turnId);
  const data = await fetchJson(`/api/capture/turns/${turnId}`);
  const msgs = data.body?.messages || [];
  const refs = data.refs || [];
  for (let i = 0; i < msgs.length && i < refs.length; i++) state.roleByHash.set(refs[i], String(msgs[i].role ?? '?'));
  state.bodies.set(turnId, data);
  return data;
}
function summarizeAdded(n, data) {
  const parentLen = n.parent ? n.parent.refs.length : 0;
  const added = (data.body?.messages || []).slice(parentLen);
  const parts = [];
  for (const m of added) {
    const role = String(m.role ?? '?');
    let text = typeof m.content === 'string' ? m.content
      : Array.isArray(m.content) ? m.content.filter((p) => p?.type === 'text').map((p) => p.text).join(' ') : '';
    text = String(text).replace(/\s+/g, ' ').trim();
    if (!text && Array.isArray(m.tool_calls)) text = '🔧 ' + m.tool_calls.map((tc) => tc.function?.name ?? '?').join(',');
    if (text && role !== 'tool') parts.push(text);
    if (parts.length >= 2) break;
  }
  return parts.join(' ／ ') || `+${n.refs.length - parentLen} 条（无文本）`;
}
function applyPreview(nodeId, sum) {
  const pv = $(`#pv-${nodeId}`);
  if (pv) pv.textContent = sum.slice(0, 90);
  const n = state.forest.byId.get(nodeId);
  const parentLen = n?.parent ? n.parent.refs.length : 0;
  const role = String(state.roleByHash.get(n?.refs[parentLen]) ?? (n?.parent ? '?' : 'S')).toLowerCase();
  const pl = $(`#pl-${nodeId}`);
  if (pl && ROLE_COL[role]) { pl.textContent = role; pl.style.background = ROLE_COL[role]; }
}
async function loadPreviews() {
  if (!state.forest) return;
  const queue = state.forest.nodes.slice().sort((a, b) => a.turns[0].ts - b.turns[0].ts);
  let i = 0;
  const worker = async () => {
    while (i < queue.length) {
      const n = queue[i++];
      if (state.previewByNode.has(n.id) || state.pvPending.has(n.id)) continue;
      state.pvPending.add(n.id);
      try {
        const data = await getBody(n.turns[n.turns.length - 1].id);
        const sum = summarizeAdded(n, data);
        state.previewByNode.set(n.id, sum);
        applyPreview(n.id, sum);
      } catch { state.previewByNode.set(n.id, null); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker(), worker()]);
}

/* ---- 会话数据装载 ---- */
async function loadTurns(identity, tenant) {
  state.identity = identity; state.tenant = tenant;
  state.turnId = null; state.chainByTurn = new Map();
  state.chain = []; state.forest = null; state.branches = []; state.sel = {};
  state.statusByCapture = new Map(); state.roleByHash = new Map(); state.previewByNode = new Map();
  state.expanded = new Set(); state.attempt = new Map(); state.panelAll = new Map();
  state.bodies = new Map(); state.pvPending = new Set(); subtreeCache.clear();
  const [turns, forensics] = await Promise.all([
    fetchJson(`/api/capture/turns?identity=${encodeURIComponent(identity)}&tenant=${encodeURIComponent(tenant)}&limit=500`),
    fetchJson(`/api/capture/cache-forensics?identity=${encodeURIComponent(identity)}&tenant=${encodeURIComponent(tenant)}&limit=500`).catch(() => null),
  ]);
  state.turns = turns.turns || [];
  if (forensics) {
    state.chain = forensics.chain || [];
    for (const e of state.chain) state.chainByTurn.set(e.id, e);
  }
  state.outOfWindow = state.turns.length - state.chain.length;
  const threadLabels = new Map((forensics?.threads || []).map((th) => [th.key, th.label]));
  const sinceTs = state.chain.length ? state.chain[0].ts : 0;
  buildForest(state.chain, threadLabels);
  loadStatuses(tenant, identity, sinceTs).then(() => renderMain()).catch(() => {});
  loadFamilyHeader(state.turns).catch(() => {});
  loadPreviews().catch(() => {});
  renderMain();
}

/* ---- 消息卡（面板内复用；prevRefs 为 null 时全部标「本轮新增」） ---- */
function renderMessage(msg, index, prevRefs, refHash) {
  const role = String(msg.role ?? '?');
  const dup = Array.isArray(prevRefs) && prevRefs.includes(refHash);
  const toolCalls = Array.isArray(msg.tool_calls) ? msg.tool_calls : [];
  const content = msg.content == null ? '' : typeof msg.content === 'string' ? msg.content
    : Array.isArray(msg.content) ? (msg.content.filter((p) => p?.type === 'text').map((p) => p.text).join('\n')
      || JSON.stringify(msg.content, null, 2))
    : JSON.stringify(msg.content, null, 2);
  const toolTag = msg.tool_call_id ? ` · 回应 <span class="mono">${esc(msg.tool_call_id)}</span>` : '';
  const long = content.length > 600;
  return `<div class="msg">
    <div class="msg-head">
      <span class="role ${esc(role)}">${esc(role)}</span>
      <span class="kind">第 ${index + 1} 条</span>
      ${dup ? '<span class="dup">同上轮（缓存命中段）</span>' : '<span class="new">本轮新增</span>'}
      ${toolTag}
    </div>
    ${toolCalls.length ? `<div class="toolcalls">${toolCalls.map((tc) => {
      let pretty = tc.function?.arguments ?? '';
      try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch {}
      return `<div class="toolcall"><span class="fn">${esc(tc.function?.name ?? '?')}</span> 调用参数<pre>${esc(pretty)}</pre></div>`;
    }).join('')}</div>` : ''}
    ${content ? `<div class="msg-body${long ? ' clamped' : ''}">${esc(content)}</div>${long ? '<button class="toggle" type="button">展开全文 ▾</button>' : ''}` : ''}
  </div>`;
}

/* ---- 事件 ---- */
$('#traj-sessions').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-identity]');
  if (!li) return;
  $$('#traj-sessions li').forEach((x) => x.classList.remove('active'));
  li.classList.add('active');
  loadTurns(li.dataset.identity, li.dataset.tenant).catch((err) => { $('#err').textContent = `轮次加载失败：${err.message}`; });
});
$('#f-search').addEventListener('input', () => loadSessions().catch(() => {}));

initChrome('trajectory.html').then(async () => {
  await loadSessions();
  const params = new URLSearchParams(location.search);
  const identity = params.get('identity');
  if (!identity) return;
  const li = $(`#traj-sessions li[data-identity="${CSS.escape(identity)}"]`);
  if (!li) { $('#err').textContent = `会话 ${identity} 不在最近 200 个会话里，请从列表里挑`; return; }
  $$('#traj-sessions li').forEach((x) => x.classList.remove('active'));
  li.classList.add('active');
  const captureId = params.get('capture_id');
  await loadTurns(identity, li.dataset.tenant);
  if (captureId) {
    // 从请求页跳来：定位该 capture_id 所在节点并图内展开
    const turn = state.turns.find((t) => t.capture_id === captureId);
    const node = turn && state.forest ? state.forest.nodes.find((n) => n.turns.some((t) => t.id === turn.id)) : null;
    if (node) {
      state.attempt.set(node.id, turn.id);
      state.expanded.add(node.id);
      renderMain();
      $(`#traj-main .grow[data-node="${node.id}"]`)?.scrollIntoView({ block: 'center' });
    } else $('#err').textContent = `轮次 ${captureId.slice(0, 8)}… 不在最近 500 轮里（可能已过 TTL 清理）`;
  }
});
</script>
