<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coding Plan Router</title>
<style>
/* 扁平印刷风 token，与 hermes-home v3 同血统：无圆角、无阴影、无渐变。
   dark = 纯黑画布 + 发光蓝；light = 纸白画布 + 电光蓝。 */
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0a0e1a; --surface-soft:rgba(232,236,255,.05);
  --accent:#5b70ff; --accent-bright:#9aa8ff; --accent-soft:rgba(91,112,255,.16);
  --success:#46c58b; --warning:#e5b35a; --danger:#e0646b;
  --text:#e8ecff; --text-2:#b8c2db; --muted:#93a0c2;
  --border:rgba(232,236,255,.24); --border-strong:rgba(232,236,255,.38);
  --hover:rgba(232,236,255,.07); --bar-track:rgba(232,236,255,.12); --bar-time:#e8ecff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f5f4f0; --surface:#fff; --surface-soft:rgba(0,0,0,.04);
    --accent:#0000f2; --accent-bright:#2027d8; --accent-soft:rgba(0,0,242,.08);
    --success:#0d8a4f; --warning:#b0750f; --danger:#c02f38;
    --text:#171a22; --text-2:#3c4354; --muted:#6d7589;
    --border:rgba(0,0,0,.22); --border-strong:rgba(0,0,0,.4);
    --hover:rgba(0,0,0,.05); --bar-track:rgba(0,0,0,.1); --bar-time:#171a22;
  }
}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1240px;padding:20px 16px 60px;background:var(--bg);color:var(--text);
  font:14px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-tap-highlight-color:transparent}
a{color:var(--accent-bright)}
h1{font-size:20px;margin:0;letter-spacing:.5px}
h2{font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:1.2px;
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---- 顶栏 ---- */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
#status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
#status .dot{width:7px;height:7px;background:var(--success);display:inline-block}
#status.stale .dot{background:var(--danger)}
#status.nodata .dot{background:var(--warning)}
header .spacer{flex:1}
button{font:inherit;color:var(--text);background:var(--surface-soft);border:1px solid var(--border);
  padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent-bright)}
button:disabled{opacity:.4;cursor:default}

/* ---- 汇总条 ---- */
#summary{display:flex;flex-wrap:wrap;gap:1px;background:var(--border);border:1px solid var(--border);margin-top:14px}
#summary>div{flex:1 1 150px;background:var(--surface);padding:10px 14px;min-width:0}
#summary b{display:block;font-size:20px;font-weight:700}
#summary span{font-size:11px;color:var(--muted);white-space:normal;
  overflow-wrap:anywhere;display:block}

/* ---- 订阅卡片：1px 缝隙成格线 ---- */
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1px;
  background:var(--border);border:1px solid var(--border)}
.subs>article{background:var(--surface);padding:16px 18px;min-width:0}
.sub-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sub-head .name{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.badge{padding:1px 7px;border:1px solid var(--border);font-size:10px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text-2)}
.badge.warn{color:var(--warning);border-color:var(--warning)}
.badge.pref{color:var(--success);border-color:var(--success);font-weight:700}
.badge.err{color:var(--danger);border-color:var(--danger)}
.sub-head .remain{margin-left:auto;font-size:12px;color:var(--text-2)}
.sub-head .remain b{color:var(--success)}
.window{margin-top:12px}
.window .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.window .row1 .lbl{font-weight:600}
.window .row1 .pct{color:var(--text-2);text-align:right;overflow-wrap:anywhere}
.window .row1 .pct b{color:var(--text)}
.track{position:relative;height:7px;background:var(--bar-track);margin-top:6px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s ease}
.fill.over{background:var(--danger)}
.marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bar-time);z-index:2}
.reset{margin-top:5px;font-size:11px;color:var(--muted);text-align:right}
.sub-foot{margin-top:12px;font-size:11px;color:var(--muted)}
details.models summary{cursor:pointer;font-size:11px;color:var(--muted);padding:6px 0}
details.models summary:hover{color:var(--accent-bright)}
details.models .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details.models .chips span{padding:1px 8px;border:1px solid var(--border);font-size:10px;color:var(--text-2)}

/* ---- 会话表 ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.toolbar input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  padding:5px 10px;flex:1 1 200px;width:auto;min-width:0;max-width:340px}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.toolbar label{font-size:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 0;flex:none;white-space:nowrap}
#sort-sel{display:none;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);padding:5px 8px}
#tenant-sel{display:none;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);padding:4px 8px}
#tenant-sel.on{display:inline-block}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:3}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--accent-bright)}
th .arrow{font-size:9px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.data{cursor:pointer}
tbody tr.data:hover{background:var(--hover)}
tbody tr.expanded{background:var(--accent-soft)}
.idcell{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:12px}
.copy{border:none;background:none;color:var(--muted);padding:4px 6px;font-size:12px;cursor:pointer}
.copy:hover{color:var(--accent-bright)}
td .lost{color:var(--danger);font-weight:700}
td .warnmiss{color:var(--warning)}
.kind{font-size:10px;color:var(--muted)}
tr.detail-row td{background:var(--surface-soft);padding:10px 14px}
tr.detail-row table{border:none}
tr.detail-row th{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}
#err{color:var(--danger);font-size:12px;min-height:1em;margin-top:6px}

/* ---- PC：表头不换行，数字列不挤压 ---- */
@media(min-width:721px){
  .toolbar .hint{font-size:12px}
}
/* ---- 手机端（≤720px）：汇总 2 列、订阅单列、表格转卡片列表 ---- */
@media(max-width:720px){
  body{padding:14px 12px 48px;font-size:13px}
  h1{font-size:18px}
  h2{margin-top:20px;letter-spacing:1px}
  header{gap:8px 10px}
  #summary{display:grid;grid-template-columns:1fr 1fr}
  #summary>div{padding:8px 12px}
  #summary b{font-size:18px}
  .subs{grid-template-columns:1fr}
  .subs>article{padding:14px}
  .toolbar input{max-width:none;flex:1 1 100%}
  #sort-sel{display:inline-block}
  .toolbar .hint{display:none}
  /* 会话表 → 卡片：隐藏表头，每行变「标签：值」块，排序走下拉 */
  #sessions-table,#sessions-table tbody,#sessions-table tr,#sessions-table td{display:block}
  #sessions-table{border:none;background:none}
  #sessions-table thead{display:none}
  #sessions-table tr{border:1px solid var(--border);border-bottom:none;background:var(--surface)}
  #sessions-table tr:last-child{border-bottom:1px solid var(--border)}
  #sessions-table tr.data{padding:9px 12px 7px}
  #sessions-table td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border:none;padding:3px 0;font-size:12px}
  #sessions-table td::before{content:attr(data-l);font-size:10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;flex:none}
  #sessions-table td.num{text-align:left}
  #sessions-table td.empty{display:block;text-align:center;padding:14px}
  .idcell{max-width:none;white-space:normal;overflow-wrap:anywhere;font-size:11px}
  .idcell .copy{vertical-align:baseline}
  tr.detail-row td{padding:10px 12px;overflow-x:auto}
  tr.detail-row td::before{content:none}
  tr.detail-row table{min-width:600px}
}
@media(max-width:720px) and (prefers-reduced-motion:no-preference){
  #sessions-table tr.data{transition:background .15s ease}
}
</style>
</head>
<body>
<header>
  <h1>Coding Plan Router</h1>
  <span id="status"><span class="dot"></span><span id="status-text">加载中…</span></span>
  <span class="spacer"></span>
  <select id="tenant-sel" aria-label="按租户筛选" title="按租户筛选（调用方）"></select>
  <button id="snap-refresh-btn" type="button" title="立即向上游查询一次各订阅额度">刷新快照</button>
  <button id="refresh-btn" type="button">手动刷新</button>
</header>
<div id="summary"></div>
<div id="err"></div>

<h2>订阅额度</h2>
<main id="subscriptions" class="subs"></main>
<div id="mappings" class="muted" style="margin-top:8px;font-size:12px"></div>

<h2>会话 / 缓存</h2>
<div class="toolbar">
  <input id="filter" type="search" placeholder="按会话 ID 筛选…" autocomplete="off">
  <select id="sort-sel" aria-label="排序方式">
    <option value="losses|-1">按丢失多→少</option>
    <option value="requests|-1">按请求多→少</option>
    <option value="full_miss_rate|-1">按 cache miss 高→低</option>
    <option value="last_ts|-1">按最后活跃新→旧</option>
    <option value="last_ts|1">按最后活跃旧→新</option>
  </select>
  <label><input type="checkbox" id="only-lost" style="margin:0">只看有丢失事件的</label>
  <span class="hint muted">点行展开请求明细；点表头排序</span>
</div>
<table id="sessions-table">
  <thead><tr>
    <th class="sortable" data-key="identity">会话 <span class="arrow"></span></th>
    <th class="sortable num" data-key="requests">请求 <span class="arrow"></span></th>
    <th class="sortable num" data-key="full_miss_rate">cache miss <span class="arrow"></span></th>
    <th class="sortable num" data-key="losses">丢失 <span class="arrow"></span></th>
    <th class="sortable" data-key="last_ts">最后活跃 <span class="arrow"></span></th>
  </tr></thead>
  <tbody id="sessions"></tbody>
</table>

<script>
'use strict';
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v)=>typeof v==='number'&&Number.isFinite(v);
const clamp=(v)=>Math.max(0,Math.min(100,v));
const state={sort:{key:'losses',dir:-1},expanded:null,openModels:false,tenant:''};
/* 租户筛选：'' = 全部租户合计（与旧行为一致）；session 行的明细按行自带 tenant 查 */
const withTenant=(path)=>state.tenant?`${path}?tenant=${encodeURIComponent(state.tenant)}`:path;

/* 订阅家族全名（后台不缩写）；alias 由 config.json backends[].alias 提供 */
const FAMILY_LABEL={ocg:'OpenCode Go',ccg:'CommandCode GOAT'};
const familyLabel=(f)=>FAMILY_LABEL[f]||f;

/* ---- 时间与倒计时 ---- */
const rel=(ts)=>{ // ts: epoch ms → 「x分钟前」
  if(!num(ts))return '时间未知';
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return '刚刚';
  if(s<3600)return `${Math.floor(s/60)} 分钟前`;
  if(s<86400)return `${Math.floor(s/3600)} 小时前`;
  return `${Math.floor(s/86400)} 天前`;
};
const toMs=(v)=>{ // resetAt 可能是 ISO 串或 epoch ms
  if(num(v)&&v>1e12)return v;
  const t=Date.parse(v);return Number.isFinite(t)?t:null;
};
const countdown=(ms)=>{ // → 「3小时 12分后重置」
  if(!num(ms))return '重置时间不可用';
  const d=ms-Date.now();
  if(d<=0)return '即将重置';
  const h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);
  return h>=24?`${Math.floor(h/24)}天 ${h%24}小时后重置`:`${h}小时 ${m}分后重置`;
};
const fmtClock=(ts)=>new Date(ts).toLocaleString('zh-CN',{hour12:false});

/* ---- 额度窗口行（hermes-home 用量卡同款：填充柱 + 周期进度标记 + 重置倒计时） ---- */
function windowRow({label,used,cap,timePct,resetText,unit}){
  const p=num(used)&&num(cap)&&cap>0?clamp(100*used/cap):null;
  const shown=p===null?'额度不可用':`<b>${used.toFixed(2)}</b> / ${cap.toFixed(0)}${unit} · ${p.toFixed(1)}%`;
  return `<div class="window">
    <div class="row1"><span class="lbl">${esc(label)}</span><span class="pct">${shown}</span></div>
    <div class="track">${p===null?'':`<div class="fill ${p>=100?'over':''}" style="width:${p}%"></div>`}${num(timePct)?`<div class="marker" title="周期时间已过 ${timePct.toFixed(1)}%" style="left:${timePct}%"></div>`:''}</div>
    <div class="reset">${esc(resetText||'')}</div>
  </div>`;
}
function monthlyOf(s){ // CCG: 月额度 $；OCG: 月度百分比
  if(num(s.monthlyCap)&&num(s.monthlySpent))return{used:s.monthlySpent,cap:s.monthlyCap,unit:'$'};
  if(num(s.monthlyPercent))return{used:s.monthlyPercent,cap:100,unit:'%'};
  return null;
}

function renderSummary(summary,status){
  state.summary=summary; // 订阅卡脚注要取各订阅的 TTFT/TPS
  const subs=(summary?.subscriptions||[]).map(x=>
    `<div><b class="num">${x.requests}</b><span>${esc(subLabel(status,x.subscription))} · ${x.errors} 错 · ${(x.total_tokens/1e6).toFixed(1)}M tok</span></div>`);
  $('#summary').innerHTML=
    `<div><b class="num">${summary?.requests??'—'}</b><span>总请求</span></div>`+
    `<div><b class="num">${summary?.sessions??'—'}</b><span>会话数</span></div>`+subs.join('');
}

/* 订阅显示名：内部名 → 「alias（家族全名）」，未知名字原样返回 */
function subLabel(status,name){
  const sub=(status?.subscriptions||[]).find(x=>x.name===name);
  if(!sub)return name;
  const alias=sub.alias||sub.name;
  return alias===sub.name?alias:`${alias}（${familyLabel(sub.family)}）`;
}

function renderSubscriptions(status){
  const subs=status.subscriptions||[];
  state.subs=subs; // 供明细行把内部名翻成「alias（家族）」
  $('#subscriptions').innerHTML=subs.map((x)=>{
    const s=x.snapshot||{};
    const monthProgress=num(s.monthProgress)?clamp(s.monthProgress)
      :(s.periodStart&&s.periodEnd?clamp(100*(Date.now()-Date.parse(s.periodStart))/(Date.parse(s.periodEnd)-Date.parse(s.periodStart))):null);
    const badges=[];
    if(!s.known)badges.push('<span class="badge err">余量未知</span>');
    else if(s.degraded)badges.push('<span class="badge warn">快照降级</span>');
    else if(s.stale)badges.push('<span class="badge warn">已过期</span>');
    const mon=monthlyOf(s);
    const remainHtml=num(s.monthlyRemaining)?`月余 <b>$${s.monthlyRemaining.toFixed(2)}</b>`:'';
    const rows=[
      windowRow({label:'5 小时',used:s.fiveHour?.used,cap:s.fiveHour?.cap,timePct:null,
        resetText:countdown(toMs(s.fiveHour?.resetAt)),unit:x.family==='ccg'?'$':'%'}),
      windowRow({label:'每周',used:s.weekly?.used,cap:s.weekly?.cap,timePct:null,
        resetText:countdown(toMs(s.weekly?.resetAt)),unit:x.family==='ccg'?'$':'%'}),
      windowRow({label:'每月',used:mon?.used,cap:mon?.cap,timePct:monthProgress,
        resetText:s.periodEnd?countdown(toMs(s.periodEnd)):'',unit:mon?.unit||'%'}),
    ].join('');
    const perf=(state.summary?.subscriptions||[]).find((p)=>p.subscription===x.name);
    const speed=[];
    if(num(perf?.avg_ttft_ms))speed.push(`TTFT ${(perf.avg_ttft_ms/1000).toFixed(2)}s`);
    if(num(perf?.tps))speed.push(`TPS ${perf.tps.toFixed(0)} tok/s`);
    // 「当前优先」= 新会话会被路由核挑中的订阅（与后端 rankBackends 同源），脚注附优先序与欠账评分
    const prefRank=(status.preference||[]).findIndex((p)=>p.name===x.name);
    const prefBadge=prefRank===0?'<span class="badge pref">当前优先</span>':'';
    const prefFoot=prefRank>=0&&num(status.preference[prefRank].score)
      ?` · 优先序 #${prefRank+1}（月欠账评分 ${status.preference[prefRank].score.toFixed(1)}）`:prefRank>0?` · 优先序 #${prefRank+1}`:'';
    return `<article>
      <div class="sub-head"><span class="name">${esc(x.alias||x.name)}</span><span class="badge">${esc(familyLabel(x.family))}</span>${prefBadge}${badges.join('')}<span class="remain">${remainHtml}</span></div>
      ${rows}
      <div class="sub-foot">${speed.length?`${speed.join(' · ')} · `:''}快照 ${s.fetchedAt?rel(s.fetchedAt):'尚无'}${num(s.ageMs)?` · ${Math.round(s.ageMs/1000)}s 前`:''}${prefFoot} · 内部名 <span class="mono">${esc(x.name)}</span>
        <details class="models"${state.openModels?' open':''}><summary>可用模型（${(x.models||[]).length}）</summary>
        <div class="chips">${(x.models||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div></details></div>
    </article>`;
  }).join('')||'<div class="empty">没有订阅</div>';
  document.querySelectorAll('details.models').forEach(d=>d.addEventListener('toggle',()=>{state.openModels=d.open;}));
  const live=new Set(subs.map(x=>x.name));
  const maps=status.mappings||[];
  $('#mappings').innerHTML=maps.length
    ?'亲和会话：'+maps.map(m=>`${m.tenant&&m.tenant!=='default'?esc(m.tenant)+' · ':''}${esc(subLabel(status,m.backend))} ${m.identities}${live.has(m.backend)?'':'（已下线，下次请求自动改绑）'}`).join(' · '):'';
}

/* ---- 会话表 ---- */
function renderSessions(sessions){
  const q=$('#filter').value.trim().toLowerCase();
  const onlyLost=$('#only-lost').checked;
  let list=(sessions||[]).filter(s=>{
    if(onlyLost&&!(s.loss_events||[]).length)return false;
    return !q||String(s.identity).toLowerCase().includes(q);
  });
  const {key,dir}=state.sort;
  list.sort((a,b)=>{
    const va=key==='losses'?(a.loss_events||[]).length:a[key];
    const vb=key==='losses'?(b.loss_events||[]).length:b[key];
    if(va===vb)return (b.requests||0)-(a.requests||0);
    return (va<vb?-1:va>vb?1:0)*dir;
  });
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.querySelector('.arrow').textContent=th.dataset.key===key?(dir<0?'▼':'▲'):'';
  });
  $('#sessions').innerHTML=list.map((s)=>{
    const losses=(s.loss_events||[]).length;
    const miss=s.full_miss_rate;
    const missHtml=miss==null?'<span class="muted">—</span>'
      :`<span class="${miss>=0.5?'lost':miss>=0.2?'warnmiss':''}">${(100*miss).toFixed(1)}%</span>`;
    const tenant=s.tenant||'default';
    const isExpanded=state.expanded===`${tenant}|${s.identity}`;
    return `<tr class="data${isExpanded?' expanded':''}" data-id="${esc(s.identity)}" data-tenant="${esc(tenant)}">
      <td data-l="会话"><div class="idcell" title="${esc(s.identity)}">${esc(s.identity)} <button class="copy" data-copy="${esc(s.identity)}" title="复制完整 ID">⧉</button></div><span class="kind">${esc(s.identity_kind)}${tenant!=='default'?` · ${esc(tenant)}`:''}</span></td>
      <td class="num" data-l="请求">${s.requests}</td>
      <td class="num" data-l="cache miss">${missHtml}</td>
      <td class="num" data-l="丢失">${losses?'<span class="lost">⚠ '+losses+'</span>':'<span class="muted">0</span>'}</td>
      <td class="num" data-l="最后活跃">${rel(s.last_ts)}</td>
    </tr>${isExpanded?`<tr class="detail-row"><td colspan="5" data-detail="${esc(tenant+'|'+s.identity)}">加载中…</td></tr>`:''}`;
  }).join('')||'<tr><td colspan="5" class="empty">没有匹配的会话</td></tr>';
}

async function showDetail(id,tenant){
  const cell=document.querySelector(`td[data-detail="${CSS.escape(tenant+'|'+id)}"]`);
  if(!cell)return;
  try{
    const data=await fetch(`/api/audit/sessions/${encodeURIComponent(id)}?tenant=${encodeURIComponent(tenant)}`).then(r=>r.json());
    if(state.expanded!==`${tenant}|${id}`)return;
    const lossTs=new Set((data.session?.loss_events||[]).map(e=>e.ts));
    const rows=(data.requests||[]).slice().reverse().map(r=>{
      const tps=num(r.stream_ms)&&r.stream_ms>0&&num(r.completion_tokens)?(r.completion_tokens*1000/r.stream_ms).toFixed(0):'—';
      return `<tr${lossTs.has(r.ts)?' style="color:var(--warning)"':''}>
      <td class="num">${fmtClock(r.ts)}</td><td>${esc(subLabel({subscriptions:state.subs||[]},r.subscription))}</td><td>${esc(r.model)}</td>
      <td class="num">${esc(r.status)}</td><td class="num">${r.prompt_tokens??'—'}</td>
      <td class="num">${r.cache_hit_tokens??'—'}</td>
      <td class="num">${num(r.ttft_ms)?(r.ttft_ms/1000).toFixed(2)+'s':'—'}</td>
      <td class="num">${tps}</td>
      <td class="num">${num(r.ms)?r.ms+'ms':'—'}</td>
      <td>${lossTs.has(r.ts)?'⚠ cache 丢失':''}</td></tr>`;}).join('');
    cell.innerHTML=`<table><thead><tr><th>时间</th><th>订阅</th><th>模型</th><th>状态</th><th>prompt</th><th>cache hit</th><th>TTFT</th><th>tok/s</th><th>耗时</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">无请求记录</td></tr>'}</tbody></table>`;
  }catch(e){cell.textContent=`明细加载失败：${e.message}`;}
}

/* ---- 主刷新循环 ---- */
let timer=null;
const fmtCountdown=(ms)=>ms<=0?'即将自动刷新':ms<60000?'<1 分后自动刷新':`${Math.ceil(ms/60000)} 分后自动刷新`;
/* 快照状态栏：随 30s 数据轮刷新，另有 5s 本地 ticker 让倒计时活着 */
const renderStatus=()=>{
  const s=state.snap||{};
  const box=$('#status');
  box.className=s.stale?'stale':s.fetchedAt?'':'nodata';
  $('#status-text').textContent=s.fetchedAt&&num(s.intervalMs)
    ?`快照 ${rel(s.fetchedAt)}${s.stale?' · 已过期':''} · ${fmtCountdown(s.fetchedAt+s.intervalMs-Date.now())}`
    :'尚无快照 · 等待首次刷新';
};
setInterval(renderStatus,5000);
const refetchSessions=()=>fetch(withTenant('/api/audit/sessions')).then(r=>r.json()).then(d=>renderSessions(d.sessions));
function renderTenantSelector(status){
  const tenants=(status&&status.tenants)||[];
  const sel=$('#tenant-sel');
  if(tenants.length<=1){sel.classList.remove('on');return;} // 单租户（或隐式 default）不显示下拉
  if(sel.dataset.count!==String(tenants.length)){
    sel.dataset.count=String(tenants.length);
    sel.innerHTML='<option value="">全部租户</option>'+tenants.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
    sel.value=state.tenant;
  }
  sel.classList.add('on');
}
async function refresh(){
  const btn=$('#refresh-btn');btn.disabled=true;
  try{
    const [status,sessions,summary]=await Promise.all([
      fetch('/api/route/status').then(r=>r.json()),
      fetch(withTenant('/api/audit/sessions')).then(r=>r.json()),
      fetch(withTenant('/api/audit/summary')).then(r=>r.json()),
    ]);
    renderTenantSelector(status);
    renderSummary(summary?.summary, status);
    renderSubscriptions(status);
    renderSessions(sessions.sessions);
    state.snap=status.snapshots||{};
    renderStatus();
    $('#err').textContent='';
  }catch(e){$('#err').textContent=`加载失败：${e.message}（将于下轮重试）`;}
  btn.disabled=false;
}

/* ---- 事件 ---- */
$('#refresh-btn').addEventListener('click',refresh);
$('#snap-refresh-btn').addEventListener('click',async()=>{ // 立即向上游查一轮额度，绕过 5 分钟轮询间隔
  const btn=$('#snap-refresh-btn');btn.disabled=true;
  try{
    await fetch('/api/snapshots/refresh',{method:'POST'});
    await refresh();
  }catch(e){$('#err').textContent=`快照刷新失败：${e.message}`;}
  btn.disabled=false;
});
$('#filter').addEventListener('input',refetchSessions);
$('#only-lost').addEventListener('change',refetchSessions);
$('#sort-sel').addEventListener('change',()=>{ // 手机端无表头可点，下拉控制排序
  const [key,dir]=String($('#sort-sel').value).split('|');
  state.sort={key,dir:Number(dir)||-1};
  refetchSessions();
});
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{
  const key=th.dataset.key;
  if(state.sort.key===key)state.sort.dir*=-1;else state.sort={key,dir:-1};
  const sel=$('#sort-sel');
  const mv=`${state.sort.key}|${state.sort.dir}`;
  if([...sel.options].some(o=>o.value===mv))sel.value=mv;
  refetchSessions();
}));
$('#sessions').addEventListener('click',(e)=>{
  const copy=e.target.closest('.copy');
  if(copy){e.stopPropagation();navigator.clipboard?.writeText(copy.dataset.copy);return;}
  const row=e.target.closest('tr.data');
  if(!row)return;
  const id=row.dataset.id;
  const tenant=row.dataset.tenant||'default';
  const key=`${tenant}|${id}`;
  state.expanded=state.expanded===key?null:key;
  fetch(withTenant('/api/audit/sessions')).then(r=>r.json()).then(d=>{renderSessions(d.sessions);if(state.expanded===key)showDetail(id,tenant);});
});
$('#tenant-sel').addEventListener('change',()=>{
  state.tenant=$('#tenant-sel').value;
  state.expanded=null;
  refresh();
});
document.addEventListener('visibilitychange',()=>{ // 后台标签页停更，回前台立即补一刷
  if(document.hidden){clearInterval(timer);timer=null;}
  else{if(!timer)timer=setInterval(refresh,30000);refresh();}
});
refresh();timer=setInterval(refresh,30000);
</script>
</body>
</html>
