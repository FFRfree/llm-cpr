<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coding Plan Router</title>
<style>
:root{font:15px system-ui,sans-serif;color:#20252b;background:#f4f6f8}body{max-width:1100px;margin:2rem auto;padding:0 1rem}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:2rem}.card{background:white;border:1px solid #dce1e6;border-radius:8px;padding:1rem;margin:.7rem 0}.subhead{display:flex;justify-content:space-between;gap:1rem}.window{display:grid;grid-template-columns:5rem 1fr 8rem;align-items:center;gap:.6rem;margin:.65rem 0}.track{height:18px;background:#e8edf2;position:relative;border-radius:3px;overflow:visible}.fill{height:100%;background:#4584c4;border-radius:3px}.fill.over{background:#c44}.month-marker{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed #e58b25;z-index:2}.muted{color:#69747e;font-size:.87rem}.session{cursor:pointer;color:#155da0;border-bottom:1px solid #e7ebef;padding:.5rem}.event{background:#fff0d9;color:#853d00;padding:.25rem .45rem;border-radius:4px;margin:.2rem}.error{color:#a22}
</style></head>
<body><h1>Coding Plan Router</h1><p id="updated" class="muted">加载中…</p><h2>订阅额度</h2><main id="subscriptions"></main><h2>会话 / 缓存</h2><section class="card"><div id="sessions">加载中…</div><div id="detail"></div></section>
<script>
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(used,cap)=>Number.isFinite(Number(used))&&Number.isFinite(Number(cap))&&Number(cap)>0?Math.max(0,Math.min(100,100*Number(used)/Number(cap))):null;
function windowRow(label,value,monthProgress){const p=pct(value?.used,value?.cap);const marker=Number.isFinite(Number(monthProgress))?Math.max(0,Math.min(100,Number(monthProgress))):null;return `<div class="window"><b>${label}</b><div class="track">${marker===null?'':`<i class="month-marker" style="left:${marker}%" title="月时间进度 ${marker.toFixed(1)}%"></i>`}${p===null?'':`<div class="fill ${p>=100?'over':''}" style="width:${p}%"></div>`}</div><span>${p===null?'未知':`${Number(value.used).toFixed(2)} / ${Number(value.cap).toFixed(2)} (${p.toFixed(1)}%)`}</span></div>`}
function monthly(s){if(Number.isFinite(Number(s.monthlyCap))&&Number.isFinite(Number(s.monthlySpent)))return {used:Number(s.monthlySpent),cap:Number(s.monthlyCap)};if(Number.isFinite(Number(s.monthlyPercent)))return {used:Number(s.monthlyPercent),cap:100};return null}
async function refresh(){try{const [status,sessions]=await Promise.all([fetch('/api/route/status').then(r=>r.json()),fetch('/api/audit/sessions').then(r=>r.json())]);document.querySelector('#updated').textContent=`快照 ${status.snapshots.fetchedAt?new Date(status.snapshots.fetchedAt).toLocaleString():'尚无'}${status.snapshots.stale?' · 已过期':''}`;document.querySelector('#subscriptions').innerHTML=status.subscriptions.map(x=>{const s=x.snapshot||{};const progress=s.monthProgress??(s.periodStart&&s.periodEnd?100*(Date.now()-Date.parse(s.periodStart))/(Date.parse(s.periodEnd)-Date.parse(s.periodStart)):null);return `<article class="card"><div class="subhead"><b>${esc(x.name)} <span class="muted">${esc(x.family)} · ${esc(x.account)}</span></b><span>${s.known?'':'余量未知'}${s.monthlyRemaining!=null?` · 月余 $${Number(s.monthlyRemaining).toFixed(2)}`:''}</span></div>${windowRow('5h',s.fiveHour,progress)}${windowRow('每周',s.weekly,progress)}${windowRow('每月',monthly(s),progress)}<small class="muted">蓝柱=已用 / 上限；橙色虚线=月时间进度。可用模型：${(x.models||[]).map(esc).join(', ')}</small></article>`}).join('')||'<p>没有订阅</p>';document.querySelector('#sessions').innerHTML=(sessions.sessions||[]).map(s=>`<div class="session" data-id="${esc(s.identity)}">${esc(s.identity)} · ${s.requests} 次 · cache miss ${s.full_miss_rate==null?'未知':(100*s.full_miss_rate).toFixed(1)+'%'} · ${s.loss_events.length} 次丢失事件</div>`).join('')||'暂无会话';document.querySelectorAll('.session').forEach(el=>el.onclick=()=>showSession(el.dataset.id));}catch(e){document.querySelector('#updated').textContent=`加载失败：${e.message}`;document.querySelector('#updated').className='error'}}
async function showSession(id){const data=await fetch(`/api/audit/sessions/${encodeURIComponent(id)}`).then(r=>r.json());const events=new Set(data.session.loss_events.map(e=>e.ts));document.querySelector('#detail').innerHTML=`<h3>${esc(id)} 详情</h3>${data.requests.map(r=>`<div class="${events.has(r.ts)?'event':'muted'}">${new Date(r.ts).toLocaleString()} · ${esc(r.subscription)} · ${esc(r.model)} · ${r.prompt_tokens??'?'} prompt / cache ${r.cache_hit_tokens??'?'} · ${events.has(r.ts)?'⚠ cache 丢失事件':''}</div>`).join('')}`}
refresh();setInterval(refresh,30000);
</script></body></html>
