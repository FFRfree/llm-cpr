<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coding Plan Router</title>
<style>
/* 扁平印刷风 token，与 hermes-home v3 同血统：无圆角、无阴影、无渐变。
   dark = 纯黑画布 + 发光蓝；light = 纸白画布 + 电光蓝。 */
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0a0e1a; --surface-soft:rgba(232,236,255,.05);
  --accent:#5b70ff; --accent-bright:#9aa8ff; --accent-soft:rgba(91,112,255,.16);
  --success:#46c58b; --warning:#e5b35a; --danger:#e0646b;
  --text:#e8ecff; --text-2:#b8c2db; --muted:#93a0c2;
  --border:rgba(232,236,255,.24); --border-strong:rgba(232,236,255,.38);
  --hover:rgba(232,236,255,.07); --bar-track:rgba(232,236,255,.12); --bar-time:#e8ecff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f5f4f0; --surface:#fff; --surface-soft:rgba(0,0,0,.04);
    --accent:#0000f2; --accent-bright:#2027d8; --accent-soft:rgba(0,0,242,.08);
    --success:#0d8a4f; --warning:#b0750f; --danger:#c02f38;
    --text:#171a22; --text-2:#3c4354; --muted:#6d7589;
    --border:rgba(0,0,0,.22); --border-strong:rgba(0,0,0,.4);
    --hover:rgba(0,0,0,.05); --bar-track:rgba(0,0,0,.1); --bar-time:#171a22;
  }
}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1200px;padding:20px 16px 60px;background:var(--bg);color:var(--text);
  font:14px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}
a{color:var(--accent-bright)}
h1{font-size:20px;margin:0;letter-spacing:.5px}
h2{font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:1.2px;
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---- 顶栏 ---- */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
#status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
#status .dot{width:7px;height:7px;background:var(--success);display:inline-block}
#status.stale .dot{background:var(--danger)}
#status.nodata .dot{background:var(--warning)}
header .spacer{flex:1}
button{font:inherit;color:var(--text);background:var(--surface-soft);border:1px solid var(--border);
  padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent-bright)}
button:disabled{opacity:.4;cursor:default}

/* ---- 汇总条 ---- */
#summary{display:flex;flex-wrap:wrap;gap:1px;background:var(--border);border:1px solid var(--border);margin-top:14px}
#summary>div{flex:1 1 130px;background:var(--surface);padding:10px 14px}
#summary b{display:block;font-size:20px;font-weight:700}
#summary span{font-size:11px;color:var(--muted);white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;display:block}

/* ---- 订阅卡片：1px 缝隙成格线 ---- */
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border)}
.subs>article{background:var(--surface);padding:16px 18px;min-width:0}
.sub-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sub-head .name{font-weight:700;font-size:15px}
.badge{padding:1px 7px;border:1px solid var(--border);font-size:10px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text-2)}
.badge.warn{color:var(--warning);border-color:var(--warning)}
.badge.err{color:var(--danger);border-color:var(--danger)}
.sub-head .remain{margin-left:auto;font-size:12px;color:var(--text-2)}
.sub-head .remain b{color:var(--success)}
.window{margin-top:12px}
.window .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.window .row1 .lbl{font-weight:600}
.window .row1 .pct{color:var(--text-2)}
.window .row1 .pct b{color:var(--text)}
.track{position:relative;height:7px;background:var(--bar-track);margin-top:6px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s ease}
.fill.over{background:var(--danger)}
.marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bar-time);z-index:2}
.reset{margin-top:5px;font-size:11px;color:var(--muted);text-align:right}
.sub-foot{margin-top:12px;font-size:11px;color:var(--muted)}
details.models summary{cursor:pointer;font-size:11px;color:var(--muted)}
details.models summary:hover{color:var(--accent-bright)}
details.models .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details.models .chips span{padding:1px 8px;border:1px solid var(--border);font-size:10px;color:var(--text-2)}

/* ---- 会话表 ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.toolbar input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  padding:4px 10px;width:280px}
.toolbar input:focus{outline:none;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:3}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--accent-bright)}
th .arrow{font-size:9px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.data{cursor:pointer}
tbody tr.data:hover{background:var(--hover)}
tbody tr.expanded{background:var(--accent-soft)}
.idcell{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:12px}
.copy{border:none;background:none;color:var(--muted);padding:0 2px;font-size:11px}
.copy:hover{color:var(--accent-bright)}
td .lost{color:var(--danger);font-weight:700}
td .warnmiss{color:var(--warning)}
.kind{font-size:10px;color:var(--muted)}
tr.detail-row td{background:var(--surface-soft);padding:10px 14px}
tr.detail-row table{border:none}
tr.detail-row th{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}
#err{color:var(--danger);font-size:12px;min-height:1em;margin-top:6px}
@media(max-width:640px){.idcell{max-width:150px}td,th{padding:6px 6px}}
</style>
</head>
<body>
<header>
  <h1>Coding Plan Router</h1>
  <span id="status"><span class="dot"></span><span id="status-text">加载中…</span></span>
  <span class="spacer"></span>
  <button id="refresh-btn" type="button">手动刷新</button>
</header>
<div id="summary"></div>
<div id="err"></div>

<h2>订阅额度</h2>
<main id="subscriptions" class="subs"></main>
<div id="mappings" class="muted" style="margin-top:8px;font-size:12px"></div>

<h2>会话 / 缓存</h2>
<div class="toolbar">
  <input id="filter" type="search" placeholder="按会话 ID 筛选…" autocomplete="off">
  <label class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="only-lost" style="margin:0">只看有丢失事件的</label>
  <span class="muted" style="font-size:12px">点行展开请求明细；点表头排序</span>
</div>
<table id="sessions-table">
  <thead><tr>
    <th class="sortable" data-key="identity">会话 <span class="arrow"></span></th>
    <th class="sortable num" data-key="requests">请求 <span class="arrow"></span></th>
    <th class="sortable num" data-key="full_miss_rate">cache miss <span class="arrow"></span></th>
    <th class="sortable num" data-key="losses">丢失 <span class="arrow"></span></th>
    <th class="sortable" data-key="last_ts">最后活跃 <span class="arrow"></span></th>
  </tr></thead>
  <tbody id="sessions"></tbody>
</table>

<script>
'use strict';
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v)=>typeof v==='number'&&Number.isFinite(v);
const clamp=(v)=>Math.max(0,Math.min(100,v));
const state={sort:{key:'losses',dir:-1},expanded:null,openModels:false};

/* ---- 时间与倒计时 ---- */
const rel=(ts)=>{ // ts: epoch ms → 「x分钟前」
  if(!num(ts))return '时间未知';
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return '刚刚';
  if(s<3600)return `${Math.floor(s/60)} 分钟前`;
  if(s<86400)return `${Math.floor(s/3600)} 小时前`;
  return `${Math.floor(s/86400)} 天前`;
};
const toMs=(v)=>{ // resetAt 可能是 ISO 串或 epoch ms
  if(num(v)&&v>1e12)return v;
  const t=Date.parse(v);return Number.isFinite(t)?t:null;
};
const countdown=(ms)=>{ // → 「3小时 12分后重置」
  if(!num(ms))return '重置时间不可用';
  const d=ms-Date.now();
  if(d<=0)return '即将重置';
  const h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);
  return h>=24?`${Math.floor(h/24)}天 ${h%24}小时后重置`:`${h}小时 ${m}分后重置`;
};
const fmtClock=(ts)=>new Date(ts).toLocaleString('zh-CN',{hour12:false});

/* ---- 额度窗口行（hermes-home 用量卡同款：填充柱 + 周期进度标记 + 重置倒计时） ---- */
function windowRow({label,used,cap,timePct,resetText,unit}){
  const p=num(used)&&num(cap)&&cap>0?clamp(100*used/cap):null;
  const shown=p===null?'额度不可用':`<b>${used.toFixed(2)}</b> / ${cap.toFixed(0)}${unit} · ${p.toFixed(1)}%`;
  return `<div class="window">
    <div class="row1"><span class="lbl">${esc(label)}</span><span class="pct">${shown}</span></div>
    <div class="track">${p===null?'':`<div class="fill ${p>=100?'over':''}" style="width:${p}%"></div>`}${num(timePct)?`<div class="marker" title="周期时间已过 ${timePct.toFixed(1)}%" style="left:${timePct}%"></div>`:''}</div>
    <div class="reset">${esc(resetText||'')}</div>
  </div>`;
}
function monthlyOf(s){ // CCG: 月额度 $；OCG: 月度百分比
  if(num(s.monthlyCap)&&num(s.monthlySpent))return{used:s.monthlySpent,cap:s.monthlyCap,unit:'$'};
  if(num(s.monthlyPercent))return{used:s.monthlyPercent,cap:100,unit:'%'};
  return null;
}

function renderSummary(summary){
  const subs=(summary?.subscriptions||[]).map(x=>
    `<div><b class="num">${x.requests}</b><span>${esc(x.subscription)} · ${x.errors} 错 · ${(x.total_tokens/1e6).toFixed(1)}M tok</span></div>`);
  $('#summary').innerHTML=
    `<div><b class="num">${summary?.requests??'—'}</b><span>总请求</span></div>`+
    `<div><b class="num">${summary?.sessions??'—'}</b><span>会话数</span></div>`+subs.join('');
}

function renderSubscriptions(status){
  const subs=status.subscriptions||[];
  $('#subscriptions').innerHTML=subs.map((x)=>{
    const s=x.snapshot||{};
    const monthProgress=num(s.monthProgress)?clamp(s.monthProgress)
      :(s.periodStart&&s.periodEnd?clamp(100*(Date.now()-Date.parse(s.periodStart))/(Date.parse(s.periodEnd)-Date.parse(s.periodStart))):null);
    const badges=[];
    if(!s.known)badges.push('<span class="badge err">余量未知</span>');
    else if(s.degraded)badges.push('<span class="badge warn">快照降级</span>');
    else if(s.stale)badges.push('<span class="badge warn">已过期</span>');
    const mon=monthlyOf(s);
    const remainHtml=num(s.monthlyRemaining)?`月余 <b>$${s.monthlyRemaining.toFixed(2)}</b>`:'';
    const rows=[
      windowRow({label:'5 小时',used:s.fiveHour?.used,cap:s.fiveHour?.cap,timePct:null,
        resetText:countdown(toMs(s.fiveHour?.resetAt)),unit:x.family==='ccg'?'$':'%'}),
      windowRow({label:'每周',used:s.weekly?.used,cap:s.weekly?.cap,timePct:null,
        resetText:countdown(toMs(s.weekly?.resetAt)),unit:x.family==='ccg'?'$':'%'}),
      windowRow({label:'每月',used:mon?.used,cap:mon?.cap,timePct:monthProgress,
        resetText:s.periodEnd?countdown(toMs(s.periodEnd)):'',unit:mon?.unit||'%'}),
    ].join('');
    return `<article>
      <div class="sub-head"><span class="name">${esc(x.name)}</span><span class="badge">${esc(x.family)}</span>${badges.join('')}<span class="remain">${remainHtml}</span></div>
      ${rows}
      <div class="sub-foot">快照 ${s.fetchedAt?rel(s.fetchedAt):'尚无'}${num(s.ageMs)?` · ${Math.round(s.ageMs/1000)}s 前`:''}
        <details class="models"${state.openModels?' open':''}><summary>可用模型（${(x.models||[]).length}）</summary>
        <div class="chips">${(x.models||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div></details></div>
    </article>`;
  }).join('')||'<div class="empty">没有订阅</div>';
  document.querySelectorAll('details.models').forEach(d=>d.addEventListener('toggle',()=>{state.openModels=d.open;}));
  const live=new Set(subs.map(x=>x.name));
  const maps=status.mappings||[];
  $('#mappings').innerHTML=maps.length
    ?'钉住会话：'+maps.map(m=>`${esc(m.backend)} ${m.identities}${live.has(m.backend)?'':'（已下线，下次请求自动迁移）'}`).join(' · '):'';
}

/* ---- 会话表 ---- */
function renderSessions(sessions){
  const q=$('#filter').value.trim().toLowerCase();
  const onlyLost=$('#only-lost').checked;
  let list=(sessions||[]).filter(s=>{
    if(onlyLost&&!(s.loss_events||[]).length)return false;
    return !q||String(s.identity).toLowerCase().includes(q);
  });
  const {key,dir}=state.sort;
  list.sort((a,b)=>{
    const va=key==='losses'?(a.loss_events||[]).length:a[key];
    const vb=key==='losses'?(b.loss_events||[]).length:b[key];
    if(va===vb)return (b.requests||0)-(a.requests||0);
    return (va<vb?-1:va>vb?1:0)*dir;
  });
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.querySelector('.arrow').textContent=th.dataset.key===key?(dir<0?'▼':'▲'):'';
  });
  $('#sessions').innerHTML=list.map((s)=>{
    const losses=(s.loss_events||[]).length;
    const miss=s.full_miss_rate;
    const missHtml=miss==null?'<span class="muted">—</span>'
      :`<span class="${miss>=0.5?'lost':miss>=0.2?'warnmiss':''}">${(100*miss).toFixed(1)}%</span>`;
    const isExpanded=state.expanded===s.identity;
    return `<tr class="data${isExpanded?' expanded':''}" data-id="${esc(s.identity)}">
      <td><div class="idcell" title="${esc(s.identity)}">${esc(s.identity)} <button class="copy" data-copy="${esc(s.identity)}" title="复制完整 ID">⧉</button></div><span class="kind">${esc(s.identity_kind)}</span></td>
      <td class="num">${s.requests}</td>
      <td class="num">${missHtml}</td>
      <td class="num">${losses?'<span class="lost">⚠ '+losses+'</span>':'<span class="muted">0</span>'}</td>
      <td class="num">${rel(s.last_ts)}</td>
    </tr>${isExpanded?'<tr class="detail-row"><td colspan="5" data-detail="'+esc(s.identity)+'">加载中…</td></tr>':''}`;
  }).join('')||'<tr><td colspan="5" class="empty">没有匹配的会话</td></tr>';
}

async function showDetail(id){
  const cell=document.querySelector(`td[data-detail="${CSS.escape(id)}"]`);
  if(!cell)return;
  try{
    const data=await fetch(`/api/audit/sessions/${encodeURIComponent(id)}`).then(r=>r.json());
    if(state.expanded!==id)return;
    const lossTs=new Set((data.session?.loss_events||[]).map(e=>e.ts));
    const rows=(data.requests||[]).slice().reverse().map(r=>`<tr${lossTs.has(r.ts)?' style="color:var(--warning)"':''}>
      <td class="num">${fmtClock(r.ts)}</td><td>${esc(r.subscription)}</td><td>${esc(r.model)}</td>
      <td class="num">${esc(r.status)}</td><td class="num">${r.prompt_tokens??'—'}</td>
      <td class="num">${r.cache_hit_tokens??'—'}</td><td class="num">${num(r.ms)?r.ms+'ms':'—'}</td>
      <td>${lossTs.has(r.ts)?'⚠ cache 丢失':''}</td></tr>`).join('');
    cell.innerHTML=`<table><thead><tr><th>时间</th><th>订阅</th><th>模型</th><th>状态</th><th>prompt</th><th>cache hit</th><th>耗时</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">无请求记录</td></tr>'}</tbody></table>`;
  }catch(e){cell.textContent=`明细加载失败：${e.message}`;}
}

/* ---- 主刷新循环 ---- */
let timer=null;
async function refresh(){
  const btn=$('#refresh-btn');btn.disabled=true;
  try{
    const [status,sessions,summary]=await Promise.all([
      fetch('/api/route/status').then(r=>r.json()),
      fetch('/api/audit/sessions').then(r=>r.json()),
      fetch('/api/audit/summary').then(r=>r.json()),
    ]);
    renderSummary(summary?.summary);
    renderSubscriptions(status);
    renderSessions(sessions.sessions);
    const snap=status.snapshots||{};
    const box=$('#status');
    box.className=snap.stale?'stale':snap.fetchedAt?'':'nodata';
    $('#status-text').textContent=snap.fetchedAt
      ?`快照 ${rel(snap.fetchedAt)}${snap.stale?' · 已过期':''} · 30s 自动刷新`
      :'尚无快照 · 30s 自动刷新';
    $('#err').textContent='';
  }catch(e){$('#err').textContent=`加载失败：${e.message}（将于下轮重试）`;}
  btn.disabled=false;
}

/* ---- 事件 ---- */
$('#refresh-btn').addEventListener('click',refresh);
$('#filter').addEventListener('input',()=>{fetch('/api/audit/sessions').then(r=>r.json()).then(d=>renderSessions(d.sessions));});
$('#only-lost').addEventListener('change',()=>{fetch('/api/audit/sessions').then(r=>r.json()).then(d=>renderSessions(d.sessions));});
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{
  const key=th.dataset.key;
  if(state.sort.key===key)state.sort.dir*=-1;else state.sort={key,dir:-1};
  fetch('/api/audit/sessions').then(r=>r.json()).then(d=>renderSessions(d.sessions));
}));
$('#sessions').addEventListener('click',(e)=>{
  const copy=e.target.closest('.copy');
  if(copy){e.stopPropagation();navigator.clipboard?.writeText(copy.dataset.copy);return;}
  const row=e.target.closest('tr.data');
  if(!row)return;
  const id=row.dataset.id;
  state.expanded=state.expanded===id?null:id;
  fetch('/api/audit/sessions').then(r=>r.json()).then(d=>{renderSessions(d.sessions);if(state.expanded===id)showDetail(id);});
});
document.addEventListener('visibilitychange',()=>{ // 后台标签页停更，回前台立即补一刷
  if(document.hidden){clearInterval(timer);timer=null;}
  else{if(!timer)timer=setInterval(refresh,30000);refresh();}
});
refresh();timer=setInterval(refresh,30000);
</script>
</body>
</html>
